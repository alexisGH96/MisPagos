name: Verificacion temporal
on:
  push:
    paths: ['.github/ver.js', '.github/workflows/ver.yml']
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12.7.0
      - run: node .github/ver.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
