name: Copia en Firebase Hosting
on:
  push:
    branches: [main]
    paths: ['web/**', 'version.json', '.github/hosting.js', '.github/workflows/hosting.yml']
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12.7.0
      - run: node .github/hosting.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MSG: web
