name: Revision de seguridad
on:
  push:
    branches: [main]
    paths: ['.github/seguridad.js']
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12.7.0
      - run: node .github/seguridad.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - run: npm audit --omit=dev --json > /tmp/a.json || true; node -e "const a=require('/tmp/a.json'); const m=(a.metadata||{}).vulnerabilities||{}; console.log('::notice::npm audit (firebase-admin del robot): ' + JSON.stringify(m))"
