name: Activar Google
on:
  push:
    branches: [main]
    paths: ['.github/activar-google.js']
permissions:
  contents: write
jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12.7.0
      - run: node .github/activar-google.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - run: |
          git config user.name "Mis Pagos (robot)"; git config user.email "robot@mispagos.local"
          git add web/auth.json && git commit -m "activar Google" && git push || echo "sin cambios"
      - run: node .github/hosting.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MSG: activar Google
