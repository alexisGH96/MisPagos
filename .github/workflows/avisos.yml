name: Avisos de pagos
on:
  schedule:
    - cron: '0 15 * * *'   # 9:00 a.m. hora de Monterrey (UTC-6)
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Mandar un aviso de prueba a todos'
        type: boolean
        default: true
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12.7.0 web-push@3.6.7
      - run: node .github/avisos.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_PUBLIC: BBWWlUcYHEoRWfJrS4J4p2rj-XzlQkzoSu9eCR5LhdSggqxL34HEPqwGJMD1YiPAczz6aJDKoOonXTQ_W5BTMVU
          PRUEBA: ${{ github.event.inputs.prueba }}
