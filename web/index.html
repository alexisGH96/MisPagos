<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Pagos">
<meta name="theme-color" content="#F6F8FC">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Mis Pagos</title>
<style>
:root{
  --bg:#F6F8FC; --fg:#121A35; --gr:#6B7488; --surf:#FFFFFF; --line:#E3E8F0;
  --acc:#1C326E; --accTxt:#FFFFFF; --nav:#FFFFFF; --pill:#1C326E; --icoSel:#FFFFFF; --ico:#626A7C;
  --t-nar:#FBE7DC; --t-ama:#FCF3D2; --t-ver:#E0F1E8; --t-azu:#E2ECF9; --t-roj:#FADDDD;
  --r-nar:#F08042; --r-ama:#E2AA14; --r-ver:#22A668; --r-azu:#3470D6; --r-roj:#DE4040;
  --tile:#FFFFFF; --hero1:#1C326E; --hero2:#2C58A8; --heroTxt:#FFFFFF;
  --sombra:0 10px 30px rgba(16,28,60,.12);
  color-scheme: light;
}
:root[data-tema="claro2"]{
  --bg:#FFFFFF; --fg:#141418; --gr:#6E6E78; --surf:#FFFFFF; --line:#E6E6EA;
  --acc:#141418; --accTxt:#FFFFFF; --pill:#F9DED4; --icoSel:#963C1E; --ico:#46464F;
  --hero1:#FBE7DC; --hero2:#FBE7DC; --heroTxt:#141418;
}
:root[data-tema="oscuro"]{
  --bg:#1B1A28; --fg:#F2F1FA; --gr:#A6A3C0; --surf:#262439; --line:#3A3858;
  --acc:#968FF5; --accTxt:#1A1830; --nav:#2A2840; --pill:#968FF5; --icoSel:#1A1830; --ico:#9692BE;
  --t-nar:#4A3540; --t-ama:#4A4335; --t-ver:#2E4440; --t-azu:#323A5E; --t-roj:#523040;
  --r-nar:#EC8E64; --r-ama:#DEB856; --r-ver:#60C492; --r-azu:#809CEC; --r-roj:#E86868;
  --tile:#3A3660; --hero1:#3A3470; --hero2:#5B52B8; --heroTxt:#FFFFFF;
  --sombra:0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0) 0 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--r-azu);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:16px 16px 130px}
h1{font-size:22px;margin:8px 0 16px;text-align:center}
h2{font-size:19px;margin:24px 4px 12px}
.fila{display:flex;align-items:center;gap:12px}
.peso{flex:1;min-width:0}
.gris{color:var(--gr)}
.chico{font-size:13px}
.b{font-weight:700}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 12px}
.sec h2{margin:0}
.pildora{border:1.5px solid var(--acc);color:var(--acc);border-radius:100px;padding:7px 14px;font-size:14px}
.btn{display:block;width:100%;border-radius:100px;padding:13px 16px;font-weight:700;text-align:center}
.btn.lleno{background:var(--acc);color:var(--accTxt)}
.btn.borde{border:1.5px solid currentColor}
.caja{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:16px}
/* encabezado */
.hola{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ava{width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--accTxt);display:grid;place-items:center;font-weight:700;font-size:20px}
.mas{width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--accTxt);font-size:28px;line-height:1}
.hero{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:var(--heroTxt);border-radius:26px;padding:20px;box-shadow:var(--sombra)}
.hero .monto{font-size:44px;font-weight:800;letter-spacing:-1px;margin:6px 0 14px}
.barra{height:7px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
:root[data-tema="claro2"] .barra{background:#fff}
.barra i{display:block;height:100%;background:#6FA4FF;border-radius:9px}
:root[data-tema="claro2"] .barra i{background:#141418}
/* tarjetas de pago */
.pago{border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;text-align:left;width:100%}
.ico{width:52px;height:52px;border-radius:15px;background:var(--tile);display:grid;place-items:center;flex:none}
.ico svg{width:28px;height:28px}
.pago .nom{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.der{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.est-nar{background:var(--t-nar)} .est-ama{background:var(--t-ama)} .est-ver{background:var(--t-ver)} .est-azu{background:var(--t-azu)} .est-roj{background:var(--t-roj)}
.prox{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;scrollbar-width:none}
.prox::-webkit-scrollbar{display:none}
.pc{flex:0 0 190px;scroll-snap-align:start;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left}
/* barra de navegación */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0));width:min(520px,calc(100% - 40px));height:64px;background:var(--nav);border-radius:40px;box-shadow:var(--sombra);display:flex;align-items:center;justify-content:space-around;padding:0 6px;border:1px solid var(--line)}
nav button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--ico);transition:background .25s,color .25s}
nav button svg{width:26px;height:26px}
nav button.sel{background:var(--pill);color:var(--icoSel)}
:root[data-tema="oscuro"] nav button.sel{background:linear-gradient(90deg,#968FF5,#766EE2)}
/* segmentos */
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:100px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:9px;border-radius:100px;font-size:14px}
.seg button.sel{background:var(--acc);color:var(--accTxt);font-weight:700}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal .dn{font-size:13px;color:var(--gr);font-weight:700;padding:8px 0}
.dia{height:52px;position:relative;display:flex;flex-direction:column;align-items:center}
.dia b{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:500;margin-top:2px}
.dia.conp b{color:#fff;font-weight:700}
.dia.sel b{box-shadow:0 0 0 2px var(--acc)}
.dia.hoy b{color:var(--r-azu);font-weight:800}
.dia.hoy.conp b{color:#fff}
.dia small{font-size:9px;font-weight:800;color:var(--r-azu);line-height:1}
.ley{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--gr);margin:12px 4px}
.ley i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* hojas (detalle / editor) */
.velo{position:fixed;inset:0;background:rgba(10,14,30,.35);opacity:0;transition:opacity .25s;z-index:20}
.velo.ver{opacity:1}
.hoja{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:21;max-width:600px;margin:0 auto}
.hoja.ver{transform:none}
.asa{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
label{display:block;font-size:13px;color:var(--gr);margin:12px 4px 6px}
input,select{width:100%;font:inherit;color:var(--fg);background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dato{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dato:last-child{border:0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:100px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s}
.toast.ver{opacity:1}
.vacio{text-align:center;color:var(--gr);padding:30px 10px}
.leyenda .f{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.leyenda .f:first-child{border:0}
.punto{width:14px;height:14px;border-radius:50%;flex:none}
.regla{height:10px;border-radius:10px;background:var(--line);position:relative;overflow:hidden;margin-top:6px}
.regla i{position:absolute;inset:0 auto 0 0;border-radius:10px}
.regla s{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
/* la dona aparece girando y creciendo, y luego los porcentajes */
.pastel path[fill]:not([fill=none]){transform-box:view-box;transform-origin:50% 50%;opacity:0}
.pastel path[fill=none],.pastel circle,.pastel text{opacity:0}
.pastel.ver path[fill]:not([fill=none]){animation:pastelEntra .8s cubic-bezier(.2,.8,.2,1) both}
.pastel.ver path[fill=none],.pastel.ver circle,.pastel.ver text{animation:pastelTexto .4s .7s both}
.barras .b{transform:scaleY(0);transform-origin:bottom}
.barras.ver .b{animation:crece .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes crece{to{transform:none}}
@keyframes pastelEntra{from{transform:rotate(-70deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes pastelTexto{from{opacity:0}to{opacity:1}}
/* ---- Glass: cristal sobre manchas de color, de día claro y de noche oscuro ---- */
:root[data-tema="glass"],:root[data-tema="glassn"]{--tile:rgba(255,255,255,.75); --hero1:rgba(255,255,255,.35); --hero2:rgba(255,255,255,.18); --heroTxt:var(--fg)}
:root[data-tema="glass"]{--bg:#E9ECFA; --fg:#12121C; --gr:#3E3E52; --surf:rgba(255,255,255,.42); --line:rgba(255,255,255,.75); --acc:#12121C; --accTxt:#fff; --nav:rgba(255,255,255,.28); --pill:rgba(255,255,255,.75); --icoSel:#CE502C; --ico:#28283A;
  --t-nar:rgba(255,255,255,.42); --t-ama:rgba(255,255,255,.42); --t-ver:rgba(255,255,255,.42); --t-azu:rgba(255,255,255,.42); --t-roj:rgba(255,255,255,.42)}
:root[data-tema="glassn"]{--bg:#0E0C1C; --fg:#F5F5FC; --gr:#C4C3D8; --surf:rgba(255,255,255,.13); --line:rgba(255,255,255,.28); --acc:#F5F5FC; --accTxt:#0E0C1C; --nav:rgba(24,22,40,.35); --pill:rgba(255,255,255,.18); --icoSel:#FF8C6E; --ico:#E8E8F4;
  --t-nar:rgba(255,255,255,.13); --t-ama:rgba(255,255,255,.13); --t-ver:rgba(255,255,255,.13); --t-azu:rgba(255,255,255,.13); --t-roj:rgba(255,255,255,.13); --tile:rgba(255,255,255,.14); color-scheme:dark}
:root[data-tema="glassn"] body{background:radial-gradient(40% 35% at 18% 15%, #9646E6 0, transparent 70%), radial-gradient(40% 35% at 85% 30%, #F05A96 0, transparent 70%), radial-gradient(45% 40% at 25% 75%, #3278FA 0, transparent 70%), radial-gradient(40% 35% at 85% 85%, #FF963C 0, transparent 70%), var(--bg);background-attachment:fixed}
/* Glass (opción A): fondo nítido y cada tarjeta lo desenfoca poco, como la barra */
:root[data-tema="glass"] body{background:transparent} :root[data-tema="glass"]{background:#C9D2F5}
#fondoGlass{display:none} :root[data-tema="glass"] #fondoGlass{display:block;position:fixed;inset:-40px;z-index:-1;background:var(--fondoGlass, url(fondo-glass-2.jpg)) center/cover;filter:blur(5px) saturate(1.2)}
/* Glass blanco: blanco con toques de color */
:root[data-tema="glassb"]{--bg:#FFFFFF; --fg:#12121C; --gr:#5A5A6E; --surf:rgba(255,255,255,.16); --line:rgba(0,0,0,.08); --acc:#12121C; --accTxt:#fff; --nav:rgba(255,255,255,.3); --pill:#F9DED4; --icoSel:#963C1E; --ico:#28283A;
  --t-nar:rgba(255,255,255,.16); --t-ama:rgba(255,255,255,.16); --t-ver:rgba(255,255,255,.16); --t-azu:rgba(255,255,255,.16); --t-roj:rgba(255,255,255,.16); --tile:rgba(255,255,255,.8); --hero1:rgba(255,255,255,.16); --hero2:rgba(255,255,255,.16); --heroTxt:#12121C}
:root[data-tema="glassb"] body{background:transparent} :root[data-tema="glassb"]{background:#fff}
:root[data-tema="glassb"] #fondoGlass{display:block;position:fixed;inset:-40px;z-index:-1;background:url(fondo-blanco-2.jpg) center/cover;filter:blur(22px)}
:root[data-tema="glassb"] .caja,:root[data-tema="glassb"] .pago,:root[data-tema="glassb"] .pc,:root[data-tema="glassb"] .hero,:root[data-tema="glassb"] .seg,:root[data-tema="glassb"] nav,:root[data-tema="glassb"] .pildora,:root[data-tema="glassb"] .btn.borde,:root[data-tema="glassb"] .mas{-webkit-backdrop-filter:blur(12px) saturate(130%);backdrop-filter:blur(20px) saturate(130%)}
:root[data-tema^="glass"] .caja,:root[data-tema^="glass"] .pago,:root[data-tema^="glass"] .pc,:root[data-tema^="glass"] .seg,:root[data-tema^="glass"] .hero,:root[data-tema^="glass"] .hoja,:root[data-tema^="glass"] input,:root[data-tema^="glass"] select{
  -webkit-backdrop-filter:blur(5px) saturate(130%);backdrop-filter:blur(5px) saturate(130%);border:.5px solid rgba(255,255,255,.18)}
:root[data-tema="glass"] .caja,:root[data-tema="glass"] .pago,:root[data-tema="glass"] .pc,:root[data-tema="glass"] .hero{background-color:rgba(255,255,255,.16)}
:root[data-tema="glassb"] .caja,:root[data-tema="glassb"] .pago,:root[data-tema="glassb"] .pc,:root[data-tema="glassb"] .hero,:root[data-tema="glassb"] .seg{border-color:rgba(0,0,0,.07)}
:root[data-tema="glassb"] .barra{background:rgba(0,0,0,.08)}
:root[data-tema="glassn"] .caja,:root[data-tema="glassn"] .pago,:root[data-tema="glassn"] .pc,:root[data-tema="glassn"] .seg,:root[data-tema="glassn"] .hero{border-color:rgba(255,255,255,.1)}
:root[data-tema^="glass"] nav{-webkit-backdrop-filter:blur(5px) saturate(130%);backdrop-filter:blur(5px) saturate(130%);border:.5px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.12)}
:root[data-tema="glassn"] nav{border-color:rgba(255,255,255,.1)} :root[data-tema="glassb"] nav{border-color:rgba(0,0,0,.07)}
:root[data-tema^="glass"] .dato{border-bottom-color:rgba(255,255,255,.18)}
:root[data-tema^="glass"] .pildora,:root[data-tema^="glass"] .btn.borde,:root[data-tema^="glass"] .mas{background:rgba(255,255,255,.25);border:.5px solid rgba(255,255,255,.18);color:var(--fg);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
:root[data-tema="glassn"] .pildora,:root[data-tema="glassn"] .btn.borde,:root[data-tema="glassn"] .mas{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.1)}
:root[data-tema="glassb"] .pildora,:root[data-tema="glassb"] .btn.borde,:root[data-tema="glassb"] .mas{border-color:rgba(0,0,0,.07)}
:root[data-tema^="glass"] .hoja{background:color-mix(in srgb, var(--bg) 70%, transparent)}
:root[data-tema^="glass"] .barra{background:rgba(255,255,255,.35)} :root[data-tema^="glass"] .barra i{background:var(--fg)}
#jalar{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--surf);color:var(--r-nar);box-shadow:var(--sombra);display:grid;place-items:center;opacity:0;transform:translateY(-60px);z-index:30;pointer-events:none;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
:root[data-tema="claro1"] #jalar{color:var(--acc)} #jalar svg{width:24px;height:24px} #jalar .ok{display:none}
#jalar.girando svg{animation:girar .8s linear infinite} #jalar.hecho .fl{display:none} #jalar.hecho .ok{display:block} #jalar.hecho svg{animation:none}
#jalar.vuelve{transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .26s}
@keyframes girar{to{transform:rotate(360deg)}}
html,body{overscroll-behavior-y:contain}
/* tarjetas y botones flotando: sombra suave debajo */
.caja,.pago,.pc,.hero{box-shadow:0 16px 36px -12px rgba(58,70,117,.34),0 3px 8px -3px rgba(58,70,117,.12)}
.mas,.pildora{box-shadow:0 10px 24px -8px rgba(58,70,117,.38)}
:root[data-tema="oscuro"] .caja,:root[data-tema="oscuro"] .pago,:root[data-tema="oscuro"] .pc,:root[data-tema="oscuro"] .hero,:root[data-tema="glassn"] .caja,:root[data-tema="glassn"] .pago,:root[data-tema="glassn"] .pc,:root[data-tema="glassn"] .hero{box-shadow:0 14px 28px -8px rgba(0,0,0,.6)}
:root[data-tema="oscuro"] .mas,:root[data-tema="oscuro"] .pildora,:root[data-tema="glassn"] .mas,:root[data-tema="glassn"] .pildora{box-shadow:0 8px 18px -6px rgba(0,0,0,.6)}
.pastel.tarde.ver path[fill]:not([fill=none]){animation-delay:.5s}
.pastel.tarde.ver path[fill=none],.pastel.tarde.ver circle,.pastel.tarde.ver text{animation-delay:1.2s}
:root[data-tema="glassb"] nav button.sel{background:radial-gradient(120% 100% at 50% 58%, rgba(255,255,255,.75) 0, rgba(255,255,255,.8) 62%, rgba(255,255,255,.95) 100%), linear-gradient(to bottom, transparent 55%, rgba(255,255,255,.35));
  border:1px solid rgba(255,255,255,.85);border-bottom-color:rgba(40,48,80,.12);box-shadow:inset 10px 6px 10px -6px rgba(255,255,255,1);color:#963C1E}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="fondoGlass"></div>
<main id="app"></main>
<nav id="nav" aria-label="Secciones"></nav>
<div id="capa"></div>
<div class="toast" id="toast" role="status"></div>
<div id="jalar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="fl" d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6"/><path class="fl" d="M17.7 2.8v3.8h-3.8M6.3 21.2v-3.8h3.8"/><path class="ok" d="M6 12.5l4 4 8-8"/></svg></div>
<script>
/* ===================== datos ===================== */
const LS = 'mispagos.v1';
let D = cargar();
function cargar(){
  try{ const d = JSON.parse(localStorage.getItem(LS)); if(d && d.pagos) return d; }catch(e){}
  return {pagos:[], nombre:'', tema:'auto', quincena:15, personas:[], ingreso:0, ingresoPago:'', ingresoFrec:0, otros:0};
}
function guardar(){ try{ localStorage.setItem(LS, JSON.stringify(D)); }catch(e){ aviso('No se pudo guardar en este navegador'); } if(typeof programarAvisos === 'function') programarAvisos(); }

const DIA = 86400000;
function hoy(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fecha(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function dias(s){ return Math.round((fecha(s) - hoy()) / DIA); }
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DSEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function corto(s){ const d = fecha(s); return d.getDate()+' '+MESES[d.getMonth()]; }
function dinero(v){ v = Number(v)||0; return '$' + v.toLocaleString('es-MX', {maximumFractionDigits: v % 1 ? 2 : 0, minimumFractionDigits: v % 1 ? 2 : 0}); }
function num(v){ return parseFloat(String(v||'').replace(/[^0-9.]/g,''))||0; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sinPrefijo(n){ return n.replace(/^Pagar |^Pago /,''); }

const FRECS = {M1:'mensual', M2:'cada 2 meses', M3:'cada 3 meses', M12:'anual', D15:'quincenal', D7:'semanal', U:'una vez'};
function sumarMes(s, n, ancla){
  const d = fecha(s); const y = d.getFullYear(), m = d.getMonth() + n;
  const max = new Date(y, m + 1, 0).getDate();
  return iso(new Date(y, m, Math.min(ancla || d.getDate(), max)));
}
function siguiente(p){
  switch(p.frec){
    case 'M1': return sumarMes(p.vence, 1, p.ancla); case 'M2': return sumarMes(p.vence, 2, p.ancla);
    case 'M3': return sumarMes(p.vence, 3, p.ancla); case 'M12': return sumarMes(p.vence, 12, p.ancla);
    case 'D15': return iso(new Date(fecha(p.vence).getTime() + 15*DIA));
    case 'D7': return iso(new Date(fecha(p.vence).getTime() + 7*DIA));
  } return p.vence;
}
/* los pagados avanzan solos al siguiente periodo cuando pasa su fecha */
function avanzar(){
  let cambio = false;
  D.pagos.forEach(p => { while(p.pagado && p.frec !== 'U' && dias(p.vence) < 0){ p.vence = siguiente(p); p.pagado = false; cambio = true; } });
  if(cambio) guardar();
}
function estado(p){
  if(p.pagado) return 'ver';
  const d = dias(p.vence);
  if(d <= 0) return 'roj'; if(d <= 3) return 'nar'; if(d <= 7) return 'ama'; return 'azu';
}
function mensual(p){
  let m = num(p.monto);
  m = {M2:m/2, M3:m/3, M12:m/12, D15:m*2, D7:m*4.33, U:0}[p.frec] ?? m;
  if(p.compartido) m = m * (p.miParte||50) / 100;
  return m;
}
function tipo(p){
  if(p.credito || p.cat==='tarjeta') return 'Tarjetas';
  if(p.cat==='renta') return 'Vivienda';
  if(p.cat==='streaming') return 'Streaming';
  if(['internet','luz','telefono'].includes(p.cat)) return 'Servicios';
  if(p.cat==='tienda') return 'Tiendas';
  return 'Otros';
}
function adivinarCat(n){
  const s = n.toLowerCase();
  if(/renta|alquiler|hipoteca|infonavit|mantenimiento/.test(s)) return 'renta';
  if(/netflix|spotify|disney|hbo|\bmax\b|prime|youtube|apple tv|crunchyroll|vix|paramount|deezer/.test(s)) return 'streaming';
  if(/tarjeta|banco|bbva|banamex|santander|hey|nu\b|rappi|mercado pago|amex|banorte|hsbc|klar|stori|didi/.test(s)) return 'tarjeta';
  if(/internet|izzi|totalplay|total play|megacable|infinitum|telmex/.test(s)) return 'internet';
  if(/luz|cfe|agua|gas|naturgy/.test(s)) return 'luz';
  if(/tel[eé]fono|telcel|at&t|movistar|bait/.test(s)) return 'telefono';
  if(/liverpool|coppel|palacio|suburbia|sears|elektra|walmart|amazon|tienda/.test(s)) return 'tienda';
  if(/tanda|grupo/.test(s)) return 'grupo';
  return 'otro';
}

/* ---- gráfica de pastel: sectores separados, esquinas redondeadas, líneas guía con punto ---- */
function pastel(vals, cols, total, centro, sub){
  const W = 320, H = 230, cx = W/2, cy = H/2, R = 82, ri = R*.66, tot = vals.reduce((a,b)=>a+b,0);
  if(!tot) return '';
  const P = (r,a) => [cx + r*Math.cos(a*Math.PI/180), cy + r*Math.sin(a*Math.PI/180)];
  const n = vals.filter(v => v > 0).length, hueco = n > 1 ? 5/R*180/Math.PI : 0, rc = 5;
  let ang = -90, h = '', meds = [];
  vals.forEach((v,i) => {
    if(v <= 0) return;
    const b = v/tot*360, a0 = ang + hueco/2, a1 = ang + b - hueco/2; meds.push([i, ang + b/2]); ang += b;
    if(a1 <= a0) return;
    let dO = rc/R*180/Math.PI, dI = rc/ri*180/Math.PI; if(a1 - a0 < 2*dI){ dO = dI = (a1-a0)/2.2; }
    const big = (x) => x > 180 ? 1 : 0;
    const p = [`M${P(R,a0+dO)}`, `A${R} ${R} 0 ${big(a1-a0-2*dO)} 1 ${P(R,a1-dO)}`, `Q${P(R,a1)} ${P(R-rc,a1)}`, `L${P(ri+rc,a1)}`, `Q${P(ri,a1)} ${P(ri,a1-dI)}`,
      `A${ri} ${ri} 0 ${big(a1-a0-2*dI)} 0 ${P(ri,a0+dI)}`, `Q${P(ri,a0)} ${P(ri+rc,a0)}`, `L${P(R-rc,a0)}`, `Q${P(R,a0)} ${P(R,a0+dO)}`, 'Z'].join(' ');
    h += `<path d="${p}" fill="${cols[i]}"/>`;
  });
  // etiquetas
  const lados = [[],[]];
  meds.forEach(([i,a]) => { const c = Math.cos(a*Math.PI/180); const pm = P(R-(R-ri)/2, a), pe = P(R+12, a); lados[c >= 0 ? 0 : 1].push({i, x0:pm[0], y0:pm[1], x1:pe[0], y1:pe[1]}); });
  lados.forEach((l, lado) => {
    l.sort((a,b) => a.y1 - b.y1); let prev = -1e9;
    l.forEach(e => { e.y1 = Math.max(e.y1, prev + 20, 12); prev = e.y1; });
    let next = 1e9; for(let k = l.length-1; k >= 0; k--){ l[k].y1 = Math.min(l[k].y1, next - 20, H - 12); next = l[k].y1; }
    l.forEach(e => {
      const d = lado === 0, xf = d ? Math.max(e.x1 + 14, cx + R + 8) : Math.min(e.x1 - 14, cx - R - 8);

/* reduce una imagen y la devuelve como dataURL */
function reducir(archivo, max, recorte){
  return new Promise((ok, mal) => { const im = new Image(); im.onload = () => {
    let w = im.width, h = im.height, sx = 0, sy = 0;
    if(recorte === 'cuadro'){ const m = Math.min(w,h); sx = (w-m)/2; sy = (h-m)/2; w = h = m; }
    if(recorte === 'portada'){ const nh = Math.min(h, w/2), nw = Math.min(w, nh*2); sx = (w-nw)/2; sy = (h-nh)/2; w = nw; h = nh; }
    const k = Math.min(1, max / Math.max(w,h)), cv = document.createElement('canvas'); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
    cv.getContext('2d').drawImage(im, sx, sy, w, h, 0, 0, cv.width, cv.height); ok(cv.toDataURL('image/jpeg', .85)); URL.revokeObjectURL(im.src); };
    im.onerror = mal; im.src = URL.createObjectURL(archivo); });
}

    return 'Este navegador no permite avisos. En iPhone: ábrela en Safari, toca Compartir → "Agregar a pantalla de inicio" y ábrela desde ese ícono (iOS 16.4 o más nuevo).';

  if(perm !== 'granted') return 'No diste permiso de notificaciones. Puedes activarlo en Ajustes del iPhone → Notificaciones → Mis Pagos.';

  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(VAPID_PUB)});
  await guardarAvisos(sub); D.avisos = true; guardar();
  return 'Avisos activados. Cada mañana a las 9:00 te avisará de los pagos que vencen en 3 días, mañana u hoy.';
}

  const box = document.getElementById('rc'), im = document.getElementById('rcI'), z = document.getElementById('rcZ'), S = 280;
  const st = {x:0, y:0, k:1, b:1};

  const ini = () => { st.b = Math.max(S / im.naturalWidth, S / im.naturalHeight); st.x = (S - im.naturalWidth * st.b) / 2; st.y = (S - im.naturalHeight * st.b) / 2; lim(); };

      const t = r.fields && r.fields.respaldoWeb && r.fields.respaldoWeb.stringValue; if(!t) return 'Todavía no tienes un respaldo en la nube.';

/* ===================== pintar ===================== */
function aplicarTema(){
  let t = D.tema || 'auto';
  const noche = matchMedia('(prefers-color-scheme: dark)').matches;
  if(t === 'auto') t = noche ? 'oscuro' : 'claro1';
  if(t === 'glass') t = noche ? 'glassn' : 'glass';
  if(t === 'glassb') t = 'glassb';
  document.documentElement.dataset.tema = t;
  if(D.fondoGlass) document.documentElement.style.setProperty('--fondoGlass', `url(${D.fondoGlass})`); else document.documentElement.style.removeProperty('--fondoGlass');
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { aplicarTema(); pintar(); });
function pintar(anim){
  avanzar();
  const app = document.getElementById('app');
  app.innerHTML = [inicio, calendario, carteraV, estadisticas, ajustes][tab]();
  if(anim && !matchMedia('(prefers-reduced-motion: reduce)').matches) app.animate([{opacity:0, transform:'translateY(8px)'}, {opacity:1, transform:'none'}], {duration:260, easing:'cubic-bezier(.2,.8,.2,1)'});
  // las gráficas se animan cuando aparecen en pantalla
  const obs = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('ver'); obs.unobserve(e.target); } }), {threshold:.35});
  app.querySelectorAll('.pastel, .barras').forEach(g => obs.observe(g));
  const n = [['inicio','Inicio'],['cal','Calendario'],['cartera','Quincenas y tarjetas'],['stats','Estadísticas'],['perfil','Ajustes']];
  document.getElementById('nav').innerHTML = n.map(([k,t],i) => `<button class="${i===tab?'sel':''}" data-act="tab" data-n="${i}" aria-label="${t}" ${i===tab?'aria-current="page"':''}>${IC[k]}</button>`).join('');
}

/* ---- jalar hacia abajo para sincronizar ---- */
(() => {
  const bola = document.getElementById('jalar'), app = document.getElementById('app'), UMBRAL = 80, MAX = 120;
  let y0 = null, d = 0, ocupado = false;
  const mover = (v, anim) => {
    bola.classList.toggle('vuelve', !!anim); app.style.transition = anim ? 'transform .26s cubic-bezier(.2,.8,.2,1)' : 'none';
    bola.style.transform = `translateY(${Math.min(v, MAX) - 60}px) rotate(${v * 2.2}deg)`; bola.style.opacity = Math.min(1, v / (UMBRAL * .6));
    app.style.transform = v ? `translateY(${Math.min(v, MAX) * .35}px)` : '';
  };
  document.addEventListener('touchstart', e => { if(ocupado || window.scrollY > 0 || document.querySelector('.hoja')) { y0 = null; return; } y0 = e.touches[0].clientY; d = 0; }, {passive:true});
  document.addEventListener('touchmove', e => {
    if(y0 === null) return; const dy = e.touches[0].clientY - y0;
    if(dy <= 0 || window.scrollY > 0){ if(d){ d = 0; mover(0, true); } return; }
    e.preventDefault(); d = dy * .55; mover(d);
  }, {passive:false});
  document.addEventListener('touchend', () => {
    if(y0 === null) return; y0 = null;
    if(d < UMBRAL){ d = 0; mover(0, true); return; }
    ocupado = true; mover(UMBRAL * .9, true); bola.classList.add('girando');
    const trabajo = (D.nube && D.nube.refresh) ? sincronizar() : Promise.resolve('Actualizado. Para compartir pagos inicia sesión en Mi perfil → Cuenta.');
    trabajo.then(r => r, e => e.message || 'No hay conexión').then(r => {
      bola.classList.remove('girando'); bola.classList.add('hecho'); aviso(r); pintar();
      setTimeout(() => { bola.classList.remove('hecho'); d = 0; mover(0, true); ocupado = false; }, 600);
    });
  });
})();
