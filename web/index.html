<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Pagos">
<meta name="theme-color" content="#F6F8FC">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Mis Pagos</title>
<style>
:root{
  --bg:#F6F8FC; --fg:#121A35; --gr:#6B7488; --surf:#FFFFFF; --line:#E3E8F0;
  --acc:#1C326E; --accTxt:#FFFFFF; --nav:#FFFFFF; --pill:#1C326E; --icoSel:#FFFFFF; --ico:#626A7C;
  --t-nar:#FBE7DC; --t-ama:#FCF3D2; --t-ver:#E0F1E8; --t-azu:#E2ECF9; --t-roj:#FADDDD;
  --r-nar:#F08042; --r-ama:#E2AA14; --r-ver:#22A668; --r-azu:#3470D6; --r-roj:#DE4040;
  --tile:#FFFFFF; --hero1:#1C326E; --hero2:#2C58A8; --heroTxt:#FFFFFF;
  --sombra:0 10px 30px rgba(16,28,60,.12);
  color-scheme: light;
}
:root[data-tema="claro2"]{
  --bg:#FFFFFF; --fg:#141418; --gr:#6E6E78; --surf:#FFFFFF; --line:#E6E6EA;
  --acc:#141418; --accTxt:#FFFFFF; --pill:#F9DED4; --icoSel:#963C1E; --ico:#46464F;
  --hero1:#FBE7DC; --hero2:#FBE7DC; --heroTxt:#141418;
}
:root[data-tema="oscuro"]{
  --bg:#1B1A28; --fg:#F2F1FA; --gr:#A6A3C0; --surf:#262439; --line:#3A3858;
  --acc:#968FF5; --accTxt:#1A1830; --nav:#2A2840; --pill:#968FF5; --icoSel:#1A1830; --ico:#9692BE;
  --t-nar:#4A3540; --t-ama:#4A4335; --t-ver:#2E4440; --t-azu:#323A5E; --t-roj:#523040;
  --r-nar:#EC8E64; --r-ama:#DEB856; --r-ver:#60C492; --r-azu:#809CEC; --r-roj:#E86868;
  --tile:#3A3660; --hero1:#3A3470; --hero2:#5B52B8; --heroTxt:#FFFFFF;
  --sombra:0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0) 0 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--r-azu);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:16px 16px 130px}
h1{font-size:22px;margin:8px 0 16px;text-align:center}
h2{font-size:19px;margin:24px 4px 12px}
.fila{display:flex;align-items:center;gap:12px}
.peso{flex:1;min-width:0}
.gris{color:var(--gr)}
.chico{font-size:13px}
.b{font-weight:700}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 12px}
.sec h2{margin:0}
.pildora{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:100px;padding:7px 14px;font-size:14px}
.btn{display:block;width:100%;border-radius:100px;padding:13px 16px;font-weight:700;text-align:center}
.btn.lleno{background:var(--acc);color:var(--accTxt)}
.btn.borde{border:1px solid var(--line);background:var(--card);color:var(--fg)}
.caja{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:16px}
/* encabezado */
.hola{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ava{width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--accTxt);display:grid;place-items:center;font-weight:700;font-size:20px}
.mas{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:#46464F;font-size:28px;line-height:1}
.hero{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:var(--heroTxt);border-radius:26px;padding:20px;box-shadow:var(--sombra)}
.hero .monto{font-size:44px;font-weight:800;letter-spacing:-1px;margin:6px 0 14px}
.barra{height:7px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
:root[data-tema="claro2"] .barra{background:#fff}
.barra i{display:block;height:100%;background:#6FA4FF;border-radius:9px}
:root[data-tema="claro2"] .barra i{background:#141418}
/* tarjetas de pago */
.pago{border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;text-align:left;width:100%}
.ico{width:52px;height:52px;border-radius:15px;background:var(--tile);display:grid;place-items:center;flex:none}
.ico svg{width:28px;height:28px}
.pago .nom{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.der{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.est-nar{background:var(--t-nar)} .est-ama{background:var(--t-ama)} .est-ver{background:var(--t-ver)} .est-azu{background:var(--t-azu)} .est-roj{background:var(--t-roj)}
.prox{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 24px 60px;margin:-14px -24px -40px !important;margin:0 -16px;padding-left:16px;scrollbar-width:none}
.prox::-webkit-scrollbar{display:none}
.pc{flex:0 0 190px;scroll-snap-align:start;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left}
/* barra de navegación */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0));width:min(520px,calc(100% - 40px));height:64px;background:var(--nav);border-radius:40px;box-shadow:var(--sombra);display:flex;align-items:center;justify-content:space-around;padding:0 6px;border:1px solid var(--line)}
nav button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--ico);transition:background .25s,color .25s}
nav button svg{width:26px;height:26px}
nav.solo{left:auto;right:max(20px, calc((100% - 520px) / 2));transform:none;width:auto;padding:0 6px;justify-content:center}
nav button.sel{background:var(--pill);color:var(--icoSel)}
:root[data-tema="oscuro"] nav button.sel{background:linear-gradient(90deg,#968FF5,#766EE2)}
/* segmentos */
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:100px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:9px;border-radius:100px;font-size:14px}
.seg button.sel{background:var(--acc);color:var(--accTxt);font-weight:700}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal .dn{font-size:13px;color:var(--gr);font-weight:700;padding:8px 0}
.dia{height:52px;position:relative;display:flex;flex-direction:column;align-items:center}
.dia b{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:500;margin-top:2px}
.dia.conp b{color:#fff;font-weight:700}
.dia.sel b{box-shadow:0 0 0 2px var(--acc)}
.dia.hoy b{color:var(--r-azu);font-weight:800}
.dia.hoy.conp b{color:#fff}
.dia small{font-size:9px;font-weight:800;color:var(--r-azu);line-height:1}
.ley{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--gr);margin:12px 4px}
.ley i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* hojas (detalle / editor) */
.velo{position:fixed;inset:0;background:rgba(10,14,30,.35);opacity:0;transition:opacity .25s;z-index:20}
.velo.ver{opacity:1}
.hoja{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:21;max-width:600px;margin:0 auto}
.hoja.ver{transform:none}
.asa{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
label{display:block;font-size:13px;color:var(--gr);margin:12px 4px 6px}
input,select{width:100%;font:inherit;color:var(--fg);background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dato{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dato:last-child{border:0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:100px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s}
.toast.ver{opacity:1}
.vacio{text-align:center;color:var(--gr);padding:30px 10px}
.leyenda .f{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.leyenda .f:first-child{border:0}
.punto{width:14px;height:14px;border-radius:50%;flex:none}
.regla{height:10px;border-radius:10px;background:var(--line);position:relative;overflow:hidden;margin-top:6px}
.regla i{position:absolute;inset:0 auto 0 0;border-radius:10px}
.regla s{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
/* la dona aparece girando y creciendo, y luego los porcentajes */
.pastel path[fill]:not([fill=none]){transform-box:view-box;transform-origin:50% 50%;opacity:0}
.pastel path[fill=none],.pastel circle,.pastel text{opacity:0}
.pastel.ver path[fill]:not([fill=none]){animation:pastelEntra .8s cubic-bezier(.2,.8,.2,1) both}
.pastel.ver path[fill=none],.pastel.ver circle,.pastel.ver text{animation:pastelTexto .4s .7s both}
.barras .b{transform:scaleY(0);transform-origin:bottom}
.barras.ver .b{animation:crece .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes crece{to{transform:none}}
/* tarjeta principal: el "!" a la altura del monto, aire entre el mes y el monto, íconos a la altura del número */
.heroMes{font-size:16px}
.filaQ{display:flex;justify-content:space-between;align-items:center;width:100%;padding:2px 0;font-size:13px;color:var(--gr)}
.filaQb{display:flex;align-items:center;padding:4px 0 4px 8px;font:inherit;font-size:13px;color:var(--gr);background:none;border:0;transition:transform .18s cubic-bezier(.3,0,.15,1)}
.filaQb:active{transform:scale(.95)}
.filaQ .flechaQ{font-size:18px;font-weight:400;margin-left:8px;color:var(--fg)}
.heroMonto{margin-left:14px}
.heroMonto b{font-size:25px !important}
.heroMonto.chico2 b{font-size:23px !important}
.aviso{width:20px;height:20px;border-radius:50%;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;flex:none;animation:pop .38s .42s cubic-bezier(.3,1.6,.5,1) both}
.heroN .ind{align-items:center}
/* tarjeta de balance en Estadísticas */
.balT{display:block;width:100%;text-align:left;padding:16px;margin-bottom:14px;font:inherit;color:inherit}
.balT .bIc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.balT .bIc svg{width:27px;height:27px}
.balT .bSep{width:1px;align-self:stretch;margin:6px 0;background:var(--fg);opacity:.12}
.balT .bBtn{display:flex;align-items:center;gap:10px;margin-top:16px;padding:8px 14px 8px 16px;border-radius:100px;font-weight:700;font-size:13px}
/* tarjetas de pago: cada dato en su renglón con ícono */
.tp{padding:14px 16px;gap:12px}
.tp .ico{width:40px;height:40px;border-radius:12px}
.tp .ico svg{width:22px;height:22px}
.tp .nom{font-size:16px;font-weight:600}
.tp .der .b{font-size:17px;font-weight:600}
.renglones{margin-top:4px;display:flex;flex-direction:column;gap:4px}
.reng{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:17px}
.reng i{width:14px;height:17px;flex:none;display:grid;place-items:center;font-style:normal}
.reng i svg{width:13px;height:13px}
.reng.una .peso{display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0}
.reng.una .con{overflow:hidden;text-overflow:ellipsis;min-width:0}
.reng.una .pt,.reng.una .ir,.reng.una .tot{flex:none}
.reng.una .ir{width:14px;height:17px;display:grid;place-items:center}
.reng.una .ir svg{width:13px;height:13px}
.reng.una .peso{gap:0}
.reng.una .pt{padding:0 6px}
.reng.una .tot{padding-left:8px}
#bloqueo{position:fixed;inset:0;z-index:9999;background:var(--bg);overflow:auto;animation:entra .4s cubic-bezier(.3,0,.15,1) both}
.blFondo{min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0) + 10px) 16px 30px}
.blIlus{width:100%;max-height:36vh;margin:6px 0 -10px}
.blFlota{animation:flota 3.2s ease-in-out infinite alternate}
@keyframes flota{to{transform:translateY(-6px)}}
.blIco{animation:flota 2.6s ease-in-out infinite alternate}
.blTar{padding:22px;border-radius:28px}
.blAv{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--pill);color:var(--icoSel,#fff);flex:none}
.blHuella{display:grid;place-items:center;width:76px;height:76px;margin:22px auto 0;border-radius:50%;background:color-mix(in srgb, var(--pill) 18%, transparent);color:var(--pill);border:0;animation:late2 2.4s ease-in-out infinite}
.blHuella svg{width:40px;height:40px}
@keyframes late2{50%{box-shadow:0 0 0 12px color-mix(in srgb, var(--pill) 12%, transparent)}}
.blLink{display:block;margin:16px auto 0;background:none;border:0;font:inherit;font-weight:700;font-size:13px;color:var(--pill)}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--gr);flex:none;position:relative;transition:border-color .2s}
.rad{--radC:var(--acc)}
:root[data-tema^="glass"] .rad{--radC:var(--icoSel)}
.rad.on{border-color:var(--radC)}
.rad::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--radC);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.rad.on::after{transform:none}
.balTar{display:flex;align-items:center;width:100%;margin-bottom:14px;padding:14px 12px 14px 16px;font:inherit;color:inherit}
.balTar.late{animation:late .9s .42s cubic-bezier(.3,0,.15,1) both}
@keyframes late{0%,100%{transform:none}25%{transform:scale(1.04)}55%{transform:none}75%{transform:scale(1.025)}}
.entra{animation:entra .42s cubic-bezier(.3,0,.15,1) both}
@keyframes entra{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.balBarra{height:12px;border-radius:99px;background:color-mix(in srgb, var(--fg) 10%, transparent);overflow:hidden;margin:14px 0 6px}
.balBarra i{display:block;height:100%;border-radius:99px;transform-origin:left;transform:scaleX(0);animation:llena .9s cubic-bezier(.3,0,.15,1) forwards}
@keyframes llena{to{transform:scaleX(var(--w))}}
.balFila .ico{width:38px;height:38px;flex:none;border-radius:12px}
.balFila .ico svg{width:20px;height:20px}
.balFila{width:100%;align-items:center;padding:10px 0;background:none;border:0;font:inherit;color:inherit}
.balChip{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--pill);color:var(--icoSel,var(--fg))}
.heroMonto{display:flex;align-items:flex-start;gap:10px;background:none;border:0;padding:0;font:inherit;color:inherit}
.interr{width:20px;height:20px;border-radius:50%;background:#E5484D;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;animation:pop .38s .42s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:none}}

@keyframes pastelEntra{from{transform:rotate(-70deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes pastelTexto{from{opacity:0}to{opacity:1}}
/* ---- Glass: cristal sobre manchas de color, de día claro y de noche oscuro ---- */
:root[data-tema="glass"],:root[data-tema="glassn"]{--tile:rgba(255,255,255,.75); --hero1:rgba(255,255,255,.35); --hero2:rgba(255,255,255,.18); --heroTxt:var(--fg)}
:root[data-tema="glass"]{--bg:#E9ECFA; --fg:#12121C; --gr:#3E3E52; --surf:rgba(255,255,255,.42); --line:rgba(255,255,255,.75); --acc:#12121C; --accTxt:#fff; --nav:rgba(255,255,255,.28); --pill:rgba(255,255,255,.75); --icoSel:#CE502C; --ico:#28283A;
  --t-nar:rgba(255,255,255,.42); --t-ama:rgba(255,255,255,.42); --t-ver:rgba(255,255,255,.42); --t-azu:rgba(255,255,255,.42); --t-roj:rgba(255,255,255,.42)}
:root[data-tema="glassn"]{--bg:#0E0C1C; --fg:#F5F5FC; --gr:#C4C3D8; --surf:rgba(255,255,255,.13); --line:rgba(255,255,255,.28); --acc:#F5F5FC; --accTxt:#0E0C1C; --nav:rgba(24,22,40,.35); --pill:rgba(255,255,255,.18); --icoSel:#FF8C6E; --ico:#E8E8F4;
  --t-nar:rgba(255,255,255,.13); --t-ama:rgba(255,255,255,.13); --t-ver:rgba(255,255,255,.13); --t-azu:rgba(255,255,255,.13); --t-roj:rgba(255,255,255,.13); --tile:rgba(255,255,255,.14); color-scheme:dark}
:root[data-tema="glassn"] body{background:radial-gradient(40% 35% at 18% 15%, #9646E6 0, transparent 70%), radial-gradient(40% 35% at 85% 30%, #F05A96 0, transparent 70%), radial-gradient(45% 40% at 25% 75%, #3278FA 0, transparent 70%), radial-gradient(40% 35% at 85% 85%, #FF963C 0, transparent 70%), var(--bg);background-attachment:fixed}
/* Glass (opción A): fondo nítido y cada tarjeta lo desenfoca poco, como la barra */
:root[data-tema="glass"] body{background:transparent} :root[data-tema="glass"]{background:#C9D2F5}
#fondoGlass{display:none} :root[data-tema="glass"] #fondoGlass{display:block;position:fixed;inset:-40px;z-index:-1;background:var(--fondoGlass, url(fondo-glass-2.jpg)) center/cover;filter:blur(var(--blurGlass, 5px)) saturate(1.2)}
/* Glass blanco: blanco con toques de color */
:root[data-tema="glassb"]{--bg:#FFFFFF; --fg:#12121C; --gr:#5A5A6E; --surf:rgba(255,255,255,.16); --line:rgba(0,0,0,.08); --acc:#12121C; --accTxt:#fff; --nav:rgba(255,255,255,.3); --pill:#F9DED4; --icoSel:#963C1E; --ico:#28283A;
  --t-nar:rgba(255,255,255,.16); --t-ama:rgba(255,255,255,.16); --t-ver:rgba(255,255,255,.16); --t-azu:rgba(255,255,255,.16); --t-roj:rgba(255,255,255,.16); --tile:rgba(255,255,255,.8); --hero1:rgba(255,255,255,.16); --hero2:rgba(255,255,255,.16); --heroTxt:#12121C}
:root[data-tema="glassb"] body{background:transparent} :root[data-tema="glassb"]{background:#fff}
:root[data-tema="glassb"] #fondoGlass{display:block;position:fixed;inset:-40px;z-index:-1;background:url(fondo-blanco-2.jpg) center/cover;filter:blur(22px)}
:root[data-tema="glassb"] .caja,:root[data-tema="glassb"] .pago,:root[data-tema="glassb"] .pc,:root[data-tema="glassb"] .hero,:root[data-tema="glassb"] .seg,:root[data-tema="glassb"] nav,:root[data-tema="glassb"] .pildora,:root[data-tema="glassb"] .btn.borde,:root[data-tema="glassb"] .mas{-webkit-backdrop-filter:blur(12px) saturate(130%);backdrop-filter:blur(20px) saturate(130%)}
:root[data-tema^="glass"] .caja,:root[data-tema^="glass"] .pago,:root[data-tema^="glass"] .pc,:root[data-tema^="glass"] .seg,:root[data-tema^="glass"] .hero,:root[data-tema^="glass"] .hoja,:root[data-tema^="glass"] input,:root[data-tema^="glass"] select{
  -webkit-backdrop-filter:blur(5px) saturate(130%);backdrop-filter:blur(5px) saturate(130%);border:.5px solid rgba(255,255,255,.18)}
:root[data-tema="glass"] .caja,:root[data-tema="glass"] .pago,:root[data-tema="glass"] .pc,:root[data-tema="glass"] .hero{background-color:rgba(255,255,255,.16)}
:root[data-tema="glassb"] .caja,:root[data-tema="glassb"] .pago,:root[data-tema="glassb"] .pc,:root[data-tema="glassb"] .hero,:root[data-tema="glassb"] .seg{border-color:rgba(0,0,0,.07)}
:root[data-tema="glassb"] .barra{background:rgba(0,0,0,.08)}
:root[data-tema="glassn"] .caja,:root[data-tema="glassn"] .pago,:root[data-tema="glassn"] .pc,:root[data-tema="glassn"] .seg,:root[data-tema="glassn"] .hero{border-color:rgba(255,255,255,.1)}

<body>
<div id="fondoGlass"></div>
<main id="app"></main>
<nav id="nav" aria-label="Secciones"></nav>
<div id="capa"></div>
<div class="toast" id="toast" role="status"></div>
<div id="jalar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="fl" d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6"/><path class="fl" d="M17.7 2.8v3.8h-3.8M6.3 21.2v-3.8h3.8"/><path class="ok" d="M6 12.5l4 4 8-8"/></svg></div>
<script>
/* ===================== datos ===================== */
const LS = 'mispagos.v1';
let D = cargar();
function cargar(){
  try{ const d = JSON.parse(localStorage.getItem(LS)); if(d && d.pagos) return d; }catch(e){}
  return {pagos:[], nombre:'', tema:'auto', quincena:15, personas:[], ingreso:0, ingresoPago:'', ingresoFrec:0, otros:0};
}
function guardar(){ try{ localStorage.setItem(LS, JSON.stringify(D)); }catch(e){ aviso('No se pudo guardar en este navegador'); } if(typeof programarAvisos === 'function') programarAvisos(); }

const DIA = 86400000;
function hoy(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fecha(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function dias(s){ return Math.round((fecha(s) - hoy()) / DIA); }
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DSEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function corto(s){ const d = fecha(s); return d.getDate()+' '+MESES[d.getMonth()]; }
function dinero(v){ v = Number(v)||0; return '$' + v.toLocaleString('es-MX', {maximumFractionDigits: v % 1 ? 2 : 0, minimumFractionDigits: v % 1 ? 2 : 0}); }
function num(v){ return parseFloat(String(v||'').replace(/[^0-9.]/g,''))||0; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sinPrefijo(n){ return n.replace(/^Pagar |^Pago /,''); }

const FRECS = {M1:'mensual', M2:'bimestral', M3:'trimestral', M6:'semestral', M12:'anual', D15:'quincenal', D7:'semanal', U:'una sola vez'};
const CATS = {tarjeta:['💳','Tarjeta de crédito'], tienda:['🛍️','Crédito departamental'], renta:['🏠','Renta / vivienda'], streaming:['🎬','Suscripciones y membresías'], internet:['📡','Internet'], luz:['💡','Luz, agua o gas'], telefono:['📱','Teléfono'], grupo:['👥','Tanda o grupo'], otro:['📌','Otro']};
const esCredito = c => c === 'tarjeta' || c === 'tienda';
function frecsDe(c){
  if(esCredito(c)) return ['M1','U','M12']; if(c === 'streaming') return ['U','M1','M6','M12']; if(c === 'renta') return ['U','M1','M2','M6','M12'];
  if(c === 'telefono' || c === 'internet') return ['M1','M6','M12']; if(c === 'grupo') return ['D7','D15','M1']; if(c === 'luz') return ['M1','M2','M3'];
  return ['M1','M2','M3','M6','M12','D15','D7','U'];
}
function sumarMes(s, n, ancla){
  const d = fecha(s); const y = d.getFullYear(), m = d.getMonth() + n;
  const max = new Date(y, m + 1, 0).getDate();
  return iso(new Date(y, m, Math.min(ancla || d.getDate(), max)));
}
function siguiente(p){
  switch(p.frec){
    case 'M1': return sumarMes(p.vence, 1, p.ancla); case 'M2': return sumarMes(p.vence, 2, p.ancla);
    case 'M3': return sumarMes(p.vence, 3, p.ancla); case 'M12': return sumarMes(p.vence, 12, p.ancla);
    case 'D15': return iso(new Date(fecha(p.vence).getTime() + 15*DIA));
    case 'D7': return iso(new Date(fecha(p.vence).getTime() + 7*DIA));
  } return p.vence;
}
/* los pagados avanzan solos al siguiente periodo cuando pasa su fecha */
const MESC = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const esServicio = c => ['luz','internet','telefono'].includes(c);   // las suscripciones no: se cobran solas
const mesesPer = f => ({M2:2, M3:3, M6:6, M12:12})[f] || 1;
const casillasPer = f => f === 'M2' || f === 'M3' || f === 'M6' ? 2 : f === 'U' || f.startsWith('D') ? 0 : 1;
function perTexto(per){ if(!per) return ''; if(!per.includes('-')) return 'año ' + per; const m = per.split(',').map(x => x.split('-').map(Number)); const a = m[0], z = m[m.length-1];
  const fa = (a[2] ? a[2] + ' ' : '') + MESC[a[1]-1], fz = (z[2] ? z[2] + ' ' : '') + MESC[z[1]-1] + ' ' + z[0];
  return m.length === 1 ? fz : fa + (a[0] !== z[0] ? ' ' + a[0] : '') + ' – ' + fz; }
function correrPer(per, n){ if(!per) return ''; if(!per.includes('-')) return String(+per + Math.floor(n/12)); return per.split(',').map(x => { const [y, m, d] = x.split('-').map(Number); const t = y*12 + m-1 + n; return Math.floor(t/12) + '-' + String(t%12+1).padStart(2,'0') + (d ? '-' + String(d).padStart(2,'0') : ''); }).join(','); }
function perHtml(p, frec, cat){
  if(!esServicio(cat)) return '';
  const n = casillasPer(frec), meses = mesesPer(frec), h = hoy(), base = h.getFullYear()*12 + h.getMonth() - 12;
  if(!n) return '';
  if(frec === 'M12'){ const y0 = h.getFullYear(), act = p.periodo && !p.periodo.includes('-') ? p.periodo : String(new Date(p.vence + 'T12:00').getFullYear());
    return `<label>Periodo facturado (año)</label><select name="perAnio">${[y0-1, y0, y0+1, y0+2].map(y => `<option ${String(y) === act ? 'selected' : ''}>${y}</option>`).join('')}</select>`; }
  const ops = Array.from({length:18}, (_, i) => { const t = base + i; return [Math.floor(t/12) + '-' + String(t%12+1).padStart(2,'0'), MESC[t%12] + ' ' + Math.floor(t/12)]; });
  const ya = p.periodo ? p.periodo.split(',') : []; const v = new Date(p.vence + 'T12:00'); const tv = v.getFullYear()*12 + v.getMonth();
  let filas = '';
  for(let k = 0; k < n; k++){
    const pa = ya.length === n ? ya[k].split('-') : null; const sug = k === 0 ? tv - meses : tv - 1;
    const quiero = pa ? pa[0] + '-' + pa[1] : Math.floor(sug/12) + '-' + String(sug%12 + 1).padStart(2,'0');
    filas += `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">${n === 2 ? `<span class="gris chico" style="width:46px">${k ? 'Hasta' : 'Desde'}</span>` : ''}<input name="dia${k}" inputmode="numeric" maxlength="2" placeholder="Día" value="${pa && pa[2] ? +pa[2] : ''}" style="width:70px;flex:none"><select name="per${k}" style="flex:1">${ops.map(o => `<option value="${o[0]}" ${o[0] === quiero ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>`; }
  return `<label>Periodo facturado</label>${filas}<p class="gris chico" style="margin:0 4px 6px">El día es opcional, solo para saber de qué fecha a qué fecha cubre el recibo.</p>`;
}
function frecUpd(f){ const c = f.cat.value, ant = f.frec.value, l = frecsDe(c);
  f.frec.innerHTML = l.map(k => `<option value="${k}" ${k === (l.includes(ant) ? ant : 'M1') ? 'selected' : ''}>${FRECS[k].charAt(0).toUpperCase() + FRECS[k].slice(1)}</option>`).join('');
  const cr = esCredito(c); document.querySelectorAll('#ed .soloCredito').forEach(e => e.style.display = cr ? '' : 'none'); }
/* datos para pagar: solo lo que sirve para pagar ese tipo de pago */
function datosVis(cat, comp){ const cred = esCredito(cat), serv = esServicio(cat), subs = cat === 'streaming', otro = ['renta','grupo','otro'].includes(cat);
  const v = {srv:serv, tj:cred, cta:cred || otro || comp, ref:cred || serv || cat === 'renta' || cat === 'otro', tit:otro || comp};
  if(subs){ v.cta = v.ref = v.tit = false; } /* suscripciones y membresías: nunca llevan datos para pagar */ v.alguno = v.srv || v.tj || v.cta || v.ref || v.tit; return v; }
function datosUpd(f){ const v = datosVis(f.cat.value || adivinarCat(f.nombre.value), !!(f.compartido && f.compartido.checked));
  const m = (el, on) => { if(el) el.style.display = on ? '' : 'none'; };
  m(document.getElementById('datosTit'), v.alguno); m(f.numServicio, v.srv); m(document.getElementById('tjBox'), v.tj); m(f.cuenta, v.cta); m(f.referencia, v.ref); m(f.titular, v.tit); }
function perUpd(f){ const p = D.pagos.find(x => x.id === +f.dataset.id) || {vence: iso(hoy()), periodo:''}; const cat = f.cat.value || adivinarCat(f.nombre.value);
  document.getElementById('perBox').innerHTML = perHtml(p, f.frec.value, cat);
  datosUpd(f); }
function avanzar(){
  let cambio = false;
  D.pagos.forEach(p => { while(p.pagado && p.frec !== 'U' && dias(p.vence) < 0){ p.vence = siguiente(p); if(p.periodo) p.periodo = correrPer(p.periodo, mesesPer(p.frec)); p.pagado = false; cambio = true; } });
  if(cambio) guardar();
}
function estado(p){
  if(p.pagado) return 'ver';
  const d = dias(p.vence);
  if(d <= 0) return 'roj'; if(d <= 3) return 'nar'; if(d <= 7) return 'ama'; return 'azu';
}
const miParteMonto = p => p.miFijo ? Math.min(num(p.monto), num(p.miFijo)) : num(p.monto) * (p.miParte || 50) / 100;
const miMonto = p => (p.pagoCon && !p.credito) ? 0 : (p.compartido ? miParteMonto(p) : num(p.monto));   // solo tu parte; con tarjeta va incluido en ella
function mensual(p){
  if(p.pagoCon && !p.credito) return 0;   // va incluido en la tarjeta con que se paga
  let m = num(p.monto);
  m = {M2:m/2, M3:m/3, M12:m/12, D15:m*2, D7:m*4.33, U:0}[p.frec] ?? m;
  if(p.compartido) m = p.miFijo ? m * miParteMonto(p) / Math.max(1, num(p.monto)) : m * (p.miParte||50) / 100;
  return m;
}
function tipo(p){
  if(p.credito || p.cat==='tarjeta') return 'Tarjetas';
  if(p.cat==='renta') return 'Vivienda';
  if(p.cat==='streaming') return 'Suscripciones';
  if(['internet','luz','telefono'].includes(p.cat)) return 'Servicios';
  if(p.cat==='tienda') return 'Tiendas';
  return 'Otros';
}
function adivinarCat(n){
  const s = n.toLowerCase();
  if(/renta|alquiler|hipoteca|infonavit|mantenimiento/.test(s)) return 'renta';
  if(/netflix|spotify|disney|hbo|\bmax\b|prime|youtube|apple tv|crunchyroll|vix|paramount|deezer/.test(s)) return 'streaming';
  if(/tarjeta|banco|bbva|banamex|santander|hey|nu\b|rappi|mercado pago|amex|banorte|hsbc|klar|stori|didi/.test(s)) return 'tarjeta';
  if(/internet|izzi|totalplay|total play|megacable|infinitum|telmex/.test(s)) return 'internet';
  if(/luz|cfe|agua|gas|naturgy/.test(s)) return 'luz';
  if(/tel[eé]fono|telcel|at&t|movistar|bait/.test(s)) return 'telefono';
  if(/liverpool|coppel|palacio|suburbia|sears|elektra|walmart|amazon|tienda/.test(s)) return 'tienda';
  if(/tanda|grupo/.test(s)) return 'grupo';
  return 'otro';
}

/* ===================== íconos ===================== */
const S = (d, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
const IC = {
  inicio: S('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'),
  cal: S('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  cartera: S('<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 11h5v4h-5a2 2 0 0 1 0-4z"/>'),
  stats: S('<path d="M6 20v-6M12 20V6M18 20v-9"/>'),
  perfil: S('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18a6.5 6.5 0 0 1 11 0"/>'),
  tarjeta: S('<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>'),
  renta: S('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>'),
  streaming: S('<rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/><path d="M8 21h8"/><path d="M10 8.5v5l4-2.5z" fill="currentColor"/>'),

function reducir(archivo, max, recorte){
  return new Promise((ok, mal) => { const im = new Image(); im.onload = () => {
    let w = im.width, h = im.height, sx = 0, sy = 0;
    if(recorte === 'cuadro'){ const m = Math.min(w,h); sx = (w-m)/2; sy = (h-m)/2; w = h = m; }
    if(recorte === 'portada'){ const nh = Math.min(h, w/2), nw = Math.min(w, nh*2); sx = (w-nw)/2; sy = (h-nh)/2; w = nw; h = nh; }
    const k = Math.min(1, max / Math.max(w,h)), cv = document.createElement('canvas'); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
    cv.getContext('2d').drawImage(im, sx, sy, w, h, 0, 0, cv.width, cv.height); ok(cv.toDataURL('image/jpeg', .85)); URL.revokeObjectURL(im.src); };
    im.onerror = mal; im.src = URL.createObjectURL(archivo); });
}

const Boveda = (() => {
  const abrir = () => new Promise((ok, mal) => { const r = indexedDB.open('mispagos-boveda', 2); r.onupgradeneeded = () => { const db = r.result; if(!db.objectStoreNames.contains('llave')) db.createObjectStore('llave'); if(!db.objectStoreNames.contains('datos')) db.createObjectStore('datos'); }; r.onsuccess = () => ok(r.result); r.onerror = mal; });

    if(!k){ k = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); await op('llave', 'readwrite', s => s.put(k, 'k')); }

    const otra = await crypto.subtle.importKey('spki', deB64(pubOtro), {name:'ECDH', namedCurve:'P-256'}, false, []);
    const bits = await crypto.subtle.deriveBits({name:'ECDH', public:otra}, (await par()).privateKey, 256);

    async e2eCifrar(pubOtro, texto){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, await comun(pubOtro), new TextEncoder().encode(texto))); const t = new Uint8Array(12 + ct.length); t.set(iv); t.set(ct, 12); return 'e2e1:' + b64(t); },

(() => {

    bola.style.transform = `translateY(${Math.min(v, MAX) - 60}px) rotate(${v * 2.2}deg)`; bola.style.opacity = Math.min(1, v / (UMBRAL * .6));

  };
  const usarCred = async () => { await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)), allowCredentials:[{type:'public-key', id:deB64(D.bloqueo.cred)}], userVerification:'required', timeout:60000}}); };
  const ilus = () => `<svg class="blIlus" viewBox="0 0 360 230" aria-hidden="true"><defs><linearGradient id="blg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F3C85"/><stop offset="1" stop-color="#223F8A"/></linearGradient></defs>
    <circle cx="180" cy="118" r="104" fill="var(--icoSel,var(--acc))" opacity=".10"/><circle cx="180" cy="118" r="80" fill="var(--icoSel,var(--acc))" opacity=".14"/>
    ${[[52,58,-10,'#1FA463'],[300,50,9,'#F08042'],[48,180,7,'#3E7BFA'],[306,176,-8,'#E2AA14']].map(([x,y,r,c],i) => `<g class="blFlota" style="animation-delay:${i*.6}s" transform="rotate(${r} ${x} ${y})"><rect x="${x-36}" y="${y-21}" width="72" height="42" rx="10" fill="var(--card,#fff)" filter="drop-shadow(0 3px 6px rgba(0,0,0,.18))"/><circle cx="${x-21}" cy="${y}" r="7" fill="${c}"/><rect x="${x-9}" y="${y-8}" width="34" height="4" rx="2" fill="#000" opacity=".15"/><rect x="${x-9}" y="${y+2}" width="22" height="4" rx="2" fill="#000" opacity=".15"/></g>`).join('')}
    <g class="blIco"><rect x="132" y="70" width="96" height="96" rx="30" fill="url(#blg)"/><circle cx="180" cy="118" r="30" fill="none" stroke="#4A68B8" stroke-width="6" stroke-dasharray="30 200" transform="rotate(200 180 118)" stroke-linecap="round"/><circle cx="180" cy="118" r="30" fill="none" stroke="#F08042" stroke-width="6" stroke-dasharray="136 200" transform="rotate(-75 180 118)" stroke-linecap="round"/>
    <rect x="164" y="103" width="32" height="29" rx="4" fill="#fff"/><path d="M164 107a4 4 0 0 1 4-4h24a4 4 0 0 1 4 4v4h-32z" fill="#F08042"/><path d="M171 120l6 6 11-11" fill="none" stroke="#1FA463" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
  const pantalla = (html) => { let c = document.getElementById('bloqueo'); if(!c){ c = document.createElement('div'); c.id = 'bloqueo'; document.body.appendChild(c); } c.innerHTML = `<div class="blFondo">${ilus()}<div class="caja blTar">${html}</div></div>`; return c; };
  const temblar = el => { el.animate([{transform:'translateX(0)'},{transform:'translateX(12px)'},{transform:'translateX(-10px)'},{transform:'translateX(6px)'},{transform:'none'}], {duration:380}); if(navigator.vibrate) navigator.vibrate([40, 40, 40]); };
  const cerrar = () => { abierta = true; const c = document.getElementById('bloqueo'); if(!c) return; if(navigator.vibrate) navigator.vibrate(20);
    c.animate([{opacity:1},{opacity:0, transform:'translateY(-20px)'}], {duration:280, easing:'cubic-bezier(.3,0,.15,1)'}).onfinish = () => c.remove(); };
  async function entrarConFace(){ try{ await usarCred(); cerrar(); }catch(e){ const p = document.getElementById('blPw'); if(p) p.focus(); } }
  async function mostrarEntrar(){
    const c = pantalla(`<div class="fila" style="align-items:center"><span class="blAv">${esc((D.nombre||'•').charAt(0).toUpperCase())}</span><div class="peso" style="padding-left:14px"><b style="font-size:20px;display:block">Hola${D.nombre ? ', ' + esc(D.nombre) : ''}</b><span class="gris chico">${esc(tapar((D.nube && D.nube.correo) || ''))}</span></div></div>
      <input id="blPw" type="password" placeholder="Contraseña" autocomplete="current-password" style="margin-top:18px;font-size:16px">
      <button class="btn lleno" id="blEnt" style="margin-top:12px">Entrar</button>
      ${D.bloqueo.cred ? `<button class="blHuella" id="blFace" aria-label="Entrar con Face ID"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9v1.5M15 9v1.5M12 9v4h-1M9.5 16c1.5 1 3.5 1 5 0"/></svg></button><div class="gris chico" style="text-align:center;margin-top:6px">Acceder con biometría</div>` : ''}
      <button class="blLink" id="blOlv">¿Olvidaste tu contraseña?</button>`);
    const pw = c.querySelector('#blPw');
    const entrar = async () => { if(await hash(D.bloqueo.sal, pw.value) === D.bloqueo.hash) cerrar(); else { pw.value = ''; pw.placeholder = 'Contraseña incorrecta'; temblar(pw); } };
    c.querySelector('#blEnt').onclick = entrar; pw.onkeydown = e => { if(e.key === 'Enter') entrar(); };
    if(D.bloqueo.cred){ c.querySelector('#blFace').onclick = entrarConFace; setTimeout(entrarConFace, 500); }
    c.querySelector('#blOlv').onclick = () => { if(navigator.vibrate) navigator.vibrate(15); mostrarRecuperar(); };
  }
  /* Olvidé mi contraseña: correo para restablecer la contraseña de la cuenta; con la nueva se comprueba que eres tú. Nunca abre sin comprobar. */
  function mostrarRecuperar(){
    const correo = (D.nube && D.nube.correo) || '';
    if(!correo){
      const c = pantalla(`<b style="font-size:22px;display:block">Recuperar contraseña</b><p class="gris" style="line-height:1.4">Como no tienes cuenta conectada, no hay a dónde enviar el correo. La única opción es borrar los datos de esta web y empezar de nuevo.</p>
        <button class="btn borde" id="blBorrar" style="margin-top:8px">Borrar todo y empezar de nuevo</button><button class="blLink" id="blVol">Volver</button>`);
      c.querySelector('#blVol').onclick = mostrarEntrar;
      c.querySelector('#blBorrar').onclick = () => { if(!confirm('Se borrarán todos tus pagos de esta web. ¿Seguro?')) return; localStorage.clear(); try{ indexedDB.deleteDatabase('mispagos-boveda'); }catch(e){} location.reload(); };
      return;
    }
    const c = pantalla(`<b style="font-size:22px;display:block">Recuperar contraseña</b><p class="gris" style="line-height:1.4;margin:8px 0 0">Escribe completo el correo o el teléfono de tu cuenta. Si coincide, te enviaremos un enlace para crear una contraseña nueva; luego la escribes aquí.</p>
      <input id="blDato" type="text" placeholder="Correo o teléfono" autocomplete="off" style="margin-top:14px;font-size:16px">
      <button class="btn lleno" id="blEnv" style="margin-top:12px">Enviar enlace de recuperación</button><p class="gris chico" id="blAv" style="display:none;line-height:1.4;margin:10px 0 0"></p>
      <input id="blNueva" type="password" placeholder="Contraseña nueva de tu cuenta" style="margin-top:12px;font-size:16px;display:none"><button class="btn lleno" id="blComp" style="margin-top:10px;display:none">Comprobar y entrar</button>
      <button class="blLink" id="blVol">Volver</button>`);
    const env = c.querySelector('#blEnv'), nv = c.querySelector('#blNueva'), comp = c.querySelector('#blComp'), dato = c.querySelector('#blDato'), av = c.querySelector('#blAv');
    c.querySelector('#blVol').onclick = mostrarEntrar;
    env.onclick = async () => {
      const q = dato.value.trim(), esC = q.includes('@'), d10 = x => (x||'').replace(/\D/g,'').slice(-10);
      const ok = esC ? q.toLowerCase() === correo.toLowerCase() : (d10(q).length === 10 && d10(q) === d10(D.miTel));
      if(!ok){ dato.value = ''; dato.placeholder = esC ? 'Ese correo no es el de tu cuenta' : 'Ese teléfono no es el de tu cuenta'; temblar(dato); return; }
      env.disabled = true; env.textContent = 'Enviando…';
      try{ await pedir('POST', AUTHU + 'sendOobCode?key=' + FB.key, {requestType:'PASSWORD_RESET', email:correo}); env.textContent = 'Volver a enviar';
        av.textContent = esC ? '✓ Te enviamos un correo a ' + q + '. Revisa también spam.' : '✓ Te enviamos el enlace al correo de la cuenta del ' + q + ' (' + tapar(correo) + '). Revisa también spam.';
        av.style.display = nv.style.display = comp.style.display = ''; nv.focus(); }
      catch(e){ env.textContent = 'Reintentar'; aviso('No se pudo enviar el correo. Revisa tu internet.'); }
      env.disabled = false; };
    comp.onclick = async () => { if(nv.value.length < 6){ temblar(nv); return; } comp.disabled = true; comp.textContent = 'Comprobando…';
      try{ await pedir('POST', AUTHU + 'signInWithPassword?key=' + FB.key, {email:correo, password:nv.value, returnSecureToken:true});
        const sal = b64(crypto.getRandomValues(new Uint8Array(12))); D.bloqueo = {sal, hash: await hash(sal, nv.value), cred: D.bloqueo.cred || null}; guardar();
        aviso('✓ Listo: ahora entras con la contraseña nueva'); cerrar(); }
      catch(e){ nv.value = ''; nv.placeholder = 'No coincide. ¿Ya la cambiaste desde el correo?'; temblar(nv); }
      comp.disabled = false; comp.textContent = 'Comprobar y entrar'; };
  }
  async function mostrarCrear(cambiar){
    const hayFace = await faceId();
    const c = pantalla(`<b style="font-size:22px;display:block">${cambiar ? 'Nueva contraseña' : 'Protege Mis Pagos'}</b><p class="gris" style="line-height:1.4;margin:8px 0 0">Crea una contraseña para entrar a la app, como en una app de banco. Así nadie más ve tus pagos ni los datos de tus tarjetas.</p>
      <input id="blA" type="password" placeholder="Contraseña (mínimo 4 caracteres)" autocomplete="new-password" style="margin-top:16px;font-size:16px"><input id="blB" type="password" placeholder="Repite la contraseña" autocomplete="new-password" style="margin-top:10px;font-size:16px">
      ${hayFace ? `<label style="display:flex;align-items:center;gap:10px;margin-top:12px"><input type="checkbox" id="blF" checked style="width:auto;margin:0"><span>También entrar con Face ID</span></label>` : ''}
      <button class="btn lleno" id="blG" style="margin-top:14px">Guardar contraseña</button>${cambiar ? '' : '<button class="blLink" id="blNo">Ahora no</button>'}`);
    c.querySelector('#blG').onclick = async () => {
      const a = c.querySelector('#blA'), b = c.querySelector('#blB');
      if(a.value.length < 4){ a.value = ''; a.placeholder = 'Mínimo 4 caracteres'; temblar(a); return; }
      if(a.value !== b.value){ b.value = ''; b.placeholder = 'No coincide'; temblar(b); return; }
      const sal = b64(crypto.getRandomValues(new Uint8Array(12)));
      let cred = null; const f = c.querySelector('#blF'); if(f && f.checked){ try{ cred = await crearCred(); }catch(e){ cred = null; } }
      D.bloqueo = {sal, hash: await hash(sal, a.value), cred}; D.bloqueoPreg = true; guardar();
      aviso(cred ? '✓ Listo: entrarás con Face ID o tu contraseña' : '✓ Contraseña guardada'); cerrar(); pintar(); };
    const no = c.querySelector('#blNo'); if(no) no.onclick = () => { D.bloqueoPreg = true; guardar(); cerrar(); };
  }
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ ocultaDesde = Date.now(); return; }
    if(activo() && ocultaDesde && Date.now() - ocultaDesde > 10 * 60000 && !document.getElementById('bloqueo')){ abierta = false; mostrarEntrar(); }   /* si ya está la pantalla de entrada (p. ej. a medio recuperar), se queda como está */
    ocultaDesde = 0; });
  return {
    iniciar(){ if(activo() && !abierta){ mostrarEntrar(); return; }
      if(!activo() && !D.bloqueoPreg && D.pagos.length) setTimeout(() => { D.bloqueoPreg = true; guardar(); mostrarCrear(false); }, 1200); },
    ajustes(){ if(!activo()) return mostrarCrear(true);
      abrirHoja(`<h1>Entrar con contraseña${D.bloqueo.cred ? ' y Face ID' : ''}</h1><div class="caja" style="padding:4px 16px">
        <button class="dato" style="width:100%;padding:14px 0" data-act="blCambiar"><span>Cambiar contraseña</span><span class="gris">›</span></button>
        <button class="dato" style="width:100%;padding:14px 0;border-top:1px solid var(--line)" data-act="blQuitar"><span>Quitar el bloqueo</span><span class="gris">›</span></button></div>
        <button class="btn borde" style="margin-top:14px" data-act="cerrar">Cerrar</button>`); },
    cambiar(){ cerrarHoja(); mostrarCrear(true); },
    async quitar(){ const pw = prompt('Escribe tu contraseña para quitar el bloqueo'); if(pw === null) return;
      if(await hash(D.bloqueo.sal, pw) !== D.bloqueo.hash){ aviso('Contraseña incorrecta'); return; } D.bloqueo = null; guardar(); cerrarHoja(); pintar(); aviso('Bloqueo quitado'); }
  };
})();

setTimeout(() => Bloq.iniciar(), 50);
</script>
