<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Pagos">
<meta name="theme-color" content="#F6F8FC">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Mis Pagos</title>
<style>
:root{
  --bg:#F6F8FC; --fg:#121A35; --gr:#6B7488; --surf:#FFFFFF; --line:#E3E8F0;
  --acc:#1C326E; --accTxt:#FFFFFF; --nav:#FFFFFF; --pill:#1C326E; --icoSel:#FFFFFF; --ico:#626A7C;
  --t-nar:#FBE7DC; --t-ama:#FCF3D2; --t-ver:#E0F1E8; --t-azu:#E2ECF9; --t-roj:#FADDDD;
  --r-nar:#F08042; --r-ama:#E2AA14; --r-ver:#22A668; --r-azu:#3470D6; --r-roj:#DE4040;
  --tile:#FFFFFF; --hero1:#1C326E; --hero2:#2C58A8; --heroTxt:#FFFFFF;
  --sombra:0 10px 30px rgba(16,28,60,.12);
  --espInicio:29px;   /* ronda 13.4.16, ítem 1: huecos entre secciones = 29 dp (medido por el coordinador en la foto real: puntos→"Próximos" y "Próximos"→cápsulas son 29 dp; el 38 px de la 13.4.15 se midió solo en web y NO es lo real). Escala web 1 px = 1 dp, como en la 13.4.15 (38 px = 38 dp) */
  color-scheme: light;
}
:root[data-tema="claro2"]{
  --bg:#FFFFFF; --fg:#141418; --gr:#6E6E78; --surf:#FFFFFF; --line:#E6E6EA;
  --acc:#141418; --accTxt:#FFFFFF; --pill:#F9DED4; --icoSel:#963C1E; --ico:#46464F;
  --hero1:#FBE7DC; --hero2:#FBE7DC; --heroTxt:#141418;
}
:root[data-tema="oscuro"]{
  --bg:#1B1A28; --fg:#F2F1FA; --gr:#A6A3C0; --surf:#262439; --line:#3A3858;
  --acc:#968FF5; --accTxt:#1A1830; --nav:#2A2840; --pill:#968FF5; --icoSel:#1A1830; --ico:#9692BE;
  --t-nar:#4A3540; --t-ama:#4A4335; --t-ver:#2E4440; --t-azu:#323A5E; --t-roj:#523040;
  --r-nar:#EC8E64; --r-ama:#DEB856; --r-ver:#60C492; --r-azu:#809CEC; --r-roj:#E86868;
  --tile:#3A3660; --hero1:#3A3470; --hero2:#5B52B8; --heroTxt:#FFFFFF;
  --sombra:0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0) 0 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--r-azu);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:16px 16px 130px}
h1{font-size:22px;margin:8px 0 16px;text-align:center}
h2{font-size:19px;margin:24px 4px 12px}
.fila{display:flex;align-items:center;gap:12px}
.peso{flex:1;min-width:0}
.gris{color:var(--gr)}
.chico{font-size:13px}
.b{font-weight:700}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.sec h2{margin:0}
.pildora{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:100px;padding:7px 14px;font-size:14px}
.btn{display:block;width:100%;border-radius:100px;padding:13px 16px;font-weight:700;text-align:center}
.btn.lleno{background:var(--acc);color:var(--accTxt)}
.btn.borde{border:1px solid var(--line);background:var(--card);color:var(--fg)}
.caja{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:16px}
/* encabezado */
.hola{display:flex;align-items:center;gap:14px;margin-bottom:var(--espInicio)}
.ava{width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--accTxt);display:grid;place-items:center;font-weight:700;font-size:20px}
.mas{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:#46464F;font-size:28px;line-height:1}
.hero{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:var(--heroTxt);border-radius:26px;padding:20px;box-shadow:var(--sombra)}
.hero .monto{font-size:44px;font-weight:800;letter-spacing:-1px;margin:6px 0 14px}
.barra{height:7px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
:root[data-tema="claro2"] .barra{background:#fff}
.barra i{display:block;height:100%;background:#6FA4FF;border-radius:9px}
:root[data-tema="claro2"] .barra i{background:#141418}
/* tarjetas de pago */
.pago{border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;text-align:left;width:100%}
.ico{width:52px;height:52px;border-radius:15px;background:var(--tile);display:grid;place-items:center;flex:none}
.ico svg{width:28px;height:28px}
.pago .nom{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.der{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.est-nar{background:var(--t-nar)} .est-ama{background:var(--t-ama)} .est-ver{background:var(--t-ver)} .est-azu{background:var(--t-azu)} .est-roj{background:var(--t-roj)}
.prox{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 24px 45px;margin:-14px -24px -40px !important;margin:0 -16px;padding-left:16px;scrollbar-width:none}   /* 13.4.16, ítem 1: hueco cápsulas→"Registro de pagos" = 29 px: 45 de padding − 40 de margen + 24 del margen superior del h2 = 29 (antes 78−40+24 = 62) */
.prox::-webkit-scrollbar{display:none}
.pc{flex:0 0 190px;scroll-snap-align:start;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left}
/* barra de navegación */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0));width:min(520px,calc(100% - 40px));height:64px;background:var(--nav);border-radius:40px;box-shadow:var(--sombra);display:flex;align-items:center;justify-content:space-around;padding:0 6px;border:1px solid var(--line)}
nav button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--ico);transition:background .25s,color .25s}
nav button svg{width:26px;height:26px}
nav.solo{left:auto;right:max(20px, calc((100% - 520px) / 2));transform:none;width:auto;padding:0 6px;justify-content:center}
nav button.sel{background:var(--pill);color:var(--icoSel)}
:root[data-tema="oscuro"] nav button.sel{background:linear-gradient(90deg,#968FF5,#766EE2)}
/* segmentos */
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:100px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:9px;border-radius:100px;font-size:14px}
.seg button.sel{background:var(--acc);color:var(--accTxt);font-weight:700}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal .dn{font-size:13px;color:var(--gr);font-weight:700;padding:8px 0}
.dia{height:52px;position:relative;display:flex;flex-direction:column;align-items:center}
.dia b{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:500;margin-top:2px}
.dia.conp b{color:#fff;font-weight:700}
.dia.sel b{box-shadow:0 0 0 2px var(--acc)}
.dia.hoy b{color:var(--r-azu);font-weight:800}
.dia.hoy.conp b{color:#fff}
.dia.hoy:not(.sel):not(.conp) b{box-shadow:0 0 0 1.5px color-mix(in srgb, var(--r-azu) 55%, transparent);background:color-mix(in srgb, var(--r-azu) 9%, transparent)}
.dia small{font-size:9px;font-weight:800;color:var(--r-azu);line-height:1}
.ley{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--gr);margin:12px 4px}
.ley i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* hojas (detalle / editor) */
.velo{position:fixed;inset:0;background:rgba(10,14,30,.35);opacity:0;transition:opacity .25s;z-index:20}
.velo.ver{opacity:1}
.hoja{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:21;max-width:600px;margin:0 auto}
.hoja.ver{transform:none}
.asa{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
label{display:block;font-size:13px;color:var(--gr);margin:12px 4px 6px}
input,select{width:100%;font:inherit;color:var(--fg);background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dato{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dato:last-child{border:0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:100px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s}
.toast.ver{opacity:1}
.vacio{text-align:center;color:var(--gr);padding:30px 10px}
.leyenda .f{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.leyenda .f:first-child{border:0}
.punto{width:14px;height:14px;border-radius:50%;flex:none}
.regla{height:10px;border-radius:10px;background:var(--line);position:relative;overflow:hidden;margin-top:6px}
.regla i{position:absolute;inset:0 auto 0 0;border-radius:10px}
.regla s{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
/* la dona aparece girando y creciendo, y luego los porcentajes */
.pastel path[fill]:not([fill=none]){transform-box:view-box;transform-origin:50% 50%;opacity:0}
.pastel path[fill=none],.pastel circle,.pastel text{opacity:0}
.pastel.ver path[fill]:not([fill=none]){animation:pastelEntra .8s cubic-bezier(.2,.8,.2,1) both}
.pastel.ver path[fill=none],.pastel.ver circle,.pastel.ver text{animation:pastelTexto .4s .7s both}
.barras .b{transform:scaleY(0);transform-origin:bottom}
.barras.ver .b{animation:crece .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes crece{to{transform:none}}
/* tarjeta principal: el "!" a la altura del monto, aire entre el mes y el monto, íconos a la altura del número */
.heroMes{font-size:16px}
.filaQ{display:flex;justify-content:space-between;align-items:center;width:100%;padding:2px 0;font-size:13px;color:var(--gr)}
@keyframes sube{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.btnIco{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:99px;flex:none}
.alQ{width:20px;height:20px;font-size:13px;display:inline-grid;place-items:center;color:#fff;border-radius:99px;flex:none;cursor:pointer}
.varia{display:block;color:#C27A00;font-weight:700;font-size:12px}
:root[data-tema="oscuro"] .varia,:root[data-tema="glassn"] .varia{color:#E8B04A}
.incl{display:inline-block;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(127,127,140,.14);color:inherit;opacity:.8;transition:transform .18s cubic-bezier(.3,0,.15,1)}
.incl:active{transform:scale(.94)}
.incl.ver{opacity:1;font-size:15px;background:none;padding:6px 0}
.filaQb{display:flex;align-items:center;padding:4px 0 4px 8px;font:inherit;font-size:13px;color:var(--gr);background:none;border:0;transition:transform .18s cubic-bezier(.3,0,.15,1)}
.filaQb:active{transform:scale(.95)}
.filaQ .flechaQ{font-size:18px;font-weight:400;margin-left:8px;color:var(--fg)}
.heroMonto{margin-left:14px}
.heroMonto b{font-size:25px !important}
.heroMonto.chico2 b{font-size:23px !important}
.aviso{width:20px;height:20px;border-radius:50%;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;flex:none;animation:pop .38s .42s cubic-bezier(.3,1.6,.5,1) both}
.heroN .ind{align-items:center}
/* tarjeta de balance en Estadísticas */
.balT{display:block;width:100%;text-align:left;padding:16px;margin-bottom:14px;font:inherit;color:inherit}
.balT .bIc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.balT .bIc svg{width:27px;height:27px}
.balT .bSep{width:1px;align-self:stretch;margin:6px 0;background:var(--fg);opacity:.12}
.balT .bBtn{display:flex;align-items:center;gap:10px;margin-top:16px;padding:8px 14px 8px 16px;border-radius:100px;font-weight:700;font-size:13px}
/* tarjetas de pago: cada dato en su renglón con ícono */
.tp{padding:14px 16px;gap:12px}
.tp .ico{width:40px;height:40px;border-radius:12px}
.tp .ico svg{width:22px;height:22px}
.tp .nom{font-size:16px;font-weight:600}
.tp .der .b{font-size:17px;font-weight:600}
.renglones{margin-top:4px;display:flex;flex-direction:column;gap:4px}
.reng{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:17px}
.reng i{width:14px;height:17px;flex:none;display:grid;place-items:center;font-style:normal}
.reng i svg{width:13px;height:13px}
.reng.una .peso{display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0}
.reng.una .con{overflow:hidden;text-overflow:ellipsis;min-width:0}
.reng.una .pt,.reng.una .ir,.reng.una .tot{flex:none}
.reng.una .ir{width:14px;height:17px;display:grid;place-items:center}
.reng.una .ir svg{width:13px;height:13px}
.reng.una .peso{gap:0}
.reng.una .pt{padding:0 6px}
.reng.una .tot{padding-left:8px}
#bloqueo{position:fixed;inset:0;z-index:9999;background:var(--bg);overflow:auto;animation:entra .4s cubic-bezier(.3,0,.15,1) both}
.blFondo{min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0) + 10px) 16px 30px}
.blIlus{width:100%;max-height:36vh;margin:6px 0 -10px}
.blFlota{animation:flota 3.2s ease-in-out infinite alternate}
@keyframes flota{to{transform:translateY(-6px)}}
.blIco{animation:flota 2.6s ease-in-out infinite alternate}
.blTar{padding:22px;border-radius:28px}
.blAv{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--pill);color:var(--icoSel,#fff);flex:none}
.blHuella{display:grid;place-items:center;width:76px;height:76px;margin:22px auto 0;border-radius:50%;background:color-mix(in srgb, var(--pill) 18%, transparent);color:var(--pill);border:0;animation:late2 2.4s ease-in-out infinite}
.blHuella svg{width:40px;height:40px}
@keyframes late2{50%{box-shadow:0 0 0 12px color-mix(in srgb, var(--pill) 12%, transparent)}}
.blLink{display:block;margin:16px auto 0;background:none;border:0;font:inherit;font-weight:700;font-size:13px;color:var(--pill)}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--gr);flex:none;position:relative;transition:border-color .2s}
.rad{--radC:var(--acc)}
:root[data-tema^="glass"] .rad{--radC:var(--icoSel)}
.rad.on{border-color:var(--radC)}
.rad::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--radC);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.rad.on::after{transform:none}
.balTar{display:flex;align-items:center;width:100%;margin-bottom:14px;padding:14px 12px 14px 16px;font:inherit;color:inherit}
.balTar.late{animation:late .9s .42s cubic-bezier(.3,0,.15,1) both}
@keyframes late{0%,100%{transform:none}25%{transform:scale(1.04)}55%{transform:none}75%{transform:scale(1.025)}}
.entra{animation:entra .42s cubic-bezier(.3,0,.15,1) both}
@keyframes entra{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.balBarra{height:12px;border-radius:99px;background:color-mix(in srgb, var(--fg) 10%, transparent);overflow:hidden;margin:14px 0 6px}
.balBarra i{display:block;height:100%;border-radius:99px;transform-origin:left;transform:scaleX(0);animation:llena .9s cubic-bezier(.3,0,.15,1) forwards}
@keyframes llena{to{transform:scaleX(var(--w))}}
.balFila .ico{width:38px;height:38px;flex:none;border-radius:12px}
.balFila .ico svg{width:20px;height:20px}
.balFila{width:100%;align-items:center;padding:10px 0;background:none;border:0;font:inherit;color:inherit}
.balChip{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--pill);color:var(--icoSel,var(--fg))}
.heroMonto{display:flex;align-items:flex-start;gap:10px;background:none;border:0;padding:0;font:inherit;color:inherit}
.interr{width:20px;height:20px;border-radius:50%;background:#E5484D;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;animation:pop .38s .42s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:none}}

@keyframes pastelEntra{from{transform:rotate(-70deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes pastelTexto{from{opacity:0}to{opacity:1}}
/* ---- Glass: cristal sobre manchas de color, de día claro y de noche oscuro ---- */
:root[data-tema="glass"],:root[data-tema="glassn"]{--tile:rgba(255,255,255,.75); --hero1:rgba(255,255,255,.35); --hero2:rgba(255,255,255,.18); --heroTxt:var(--fg)}
:root[data-tema="glass"]{--bg:#E9ECFA; --fg:#12121C; --gr:#3E3E52; --surf:rgba(255,255,255,.42); --line:rgba(255,255,255,.75); --acc:#12121C; --accTxt:#fff; --nav:rgba(255,255,255,.28); --pill:rgba(255,255,255,.75); --icoSel:#CE502C; --ico:#28283A;
  --t-nar:rgba(255,255,255,.42); --t-ama:rgba(255,255,255,.42); --t-ver:rgba(255,255,255,.42); --t-azu:rgba(255,255,255,.42); --t-roj:rgba(255,255,255,.42)}
:root[data-tema="glassn"]{--bg:#0E0C1C; --fg:#F5F5FC; --gr:#C4C3D8; --surf:rgba(255,255,255,.13); --line:rgba(255,255,255,.28); --acc:#F5F5FC; --accTxt:#0E0C1C; --nav:rgba(24,22,40,.35); --pill:rgba(255,255,255,.18); --icoSel:#FF8C6E; --ico:#E8E8F4;
  --t-nar:rgba(255,255,255,.13); --t-ama:rgba(255,255,255,.13); --t-ver:rgba(255,255,255,.13); --t-azu:rgba(255,255,255,.13); --t-roj:rgba(255,255,255,.13); --tile:rgba(255,255,255,.14); color-scheme:dark}
:root[data-tema="glassn"] body{background:radial-gradient(40% 35% at 18% 15%, #9646E6 0, transparent 70%), radial-gradient(40% 35% at 85% 30%, #F05A96 0, transparent 70%), radial-gradient(45% 40% at 25% 75%, #3278FA 0, transparent 70%), radial-gradient(40% 35% at 85% 85%, #FF963C 0, transparent 70%), var(--bg);background-attachment:fixed}
/* Glass (opción A): fondo nítido y cada tarjeta lo desenfoca poco, como la barra */
:root[data-tema="glass"] body{background:transparent} :root[data-tema="glass"]{background:#C9D2F5}
#fondoGlass{display:none} :root[data-tema="glass"] #fondoGlass{display:block;position:fixed;inset:-40px;z-index:-1;background:var(--fondoGlass, url(fondo-glass-2.jpg)) center/cover;filter:blur(var(--blurGlass, 5px)) saturate(1.2)}
/* Glass blanco: blanco con toques de color */
:root[data-tema="glassb"]{--bg:#FFFFFF; --fg:#12121C; --gr:#5A5A6E; --surf:rgba(255,255,255,.16); --line:rgba(0,0,0,.08); --acc:#12121C; --accTxt:#fff; --nav:rgba(255,255,255,.3); --pill:#F9DED4; --icoSel:#963C1E; --ico:#28283A;
  --t-nar:rgba(255,255,255,.16); --t-ama:rgba(255,255,255,.16); --t-ver:rgba(255,255,255,.16); --t-azu:rgba(255,255,255,.16); --t-roj:rgba(255,255,255,.16); --tile:rgba(255,255,255,.8); --hero1:rgba(255,255,255,.16); --hero2:rgba(255,255,255,.16); --heroTxt:#12121C}
:root[data-tema="glassb"] body{background:transparent} :root[data-tema="glassb"]{background:#fff}
:root[data-tema="glassb"] #fondoGlass{display:block;position:fixed;inset:-40px;z-index:-1;background:url(fondo-blanco-2.jpg) center/cover;filter:blur(22px)}

/* ---- carrusel de la tarjeta principal (ítem 11): mismo tamaño en todas, una por deslizada ---- */
.carPlacaCont{position:relative}
.carPlaca{position:absolute;top:-11px;left:-11px;right:-11px;bottom:var(--espInicio);background:rgba(28,43,74,.06);border:1px solid rgba(0,0,0,.08);-webkit-backdrop-filter:blur(6px) saturate(130%);backdrop-filter:blur(6px) saturate(130%);border-radius:29px;opacity:0;pointer-events:none;transition:opacity .2s}   /* 13.4.16, ítem 3: placa pizarra del video (Smart Widgets), medida: #606FA1, 11 px por los lados y arriba, cubre los puntos abajo */
.carPlacaCont.carPlacaOn .carPlaca{opacity:1}
.carWrap{position:relative;overflow:hidden;touch-action:none}   /* 13.6: sobre el carrusel solo se desliza a los lados (la página no se mueve hacia abajo por accidente) */   /* relative para quedar sobre la placa */
.carTrack{display:flex;align-items:stretch;column-gap:8%;transition:transform .5s cubic-bezier(.22,.9,.28,1)}   /* 13.4.16, ítem 3: hueco ~8 % entre tarjetas (video: 7–10 %); el desplazamiento pasa a pasos de 108 % */
.carSlide{flex:0 0 100%;min-width:0;display:flex;transition:transform .5s cubic-bezier(.22,.9,.28,1),border-radius .5s cubic-bezier(.22,.9,.28,1)}
/* ítem 7 (ronda 13.4.15, estilo Samsung Smart Widgets) + 13.4.16, ítem 3: la tarjeta que entra llega
   a 0.95 (medido del video, antes 0.92) con las esquinas redondeadas y crece hasta su tamaño al asentarse */
.carSlide.carEntra{transform:scale(.95);border-radius:32px;overflow:hidden}
.carSlide>*{flex:1;min-width:0}
.carSlide .hero{display:flex;flex-direction:column;padding:20px}
.carSlide:first-child .hero{padding-bottom:12px}   /* 13.5.2: la tarjeta de Inicio queda como estaba */
.carTrack{align-items:flex-start}
.carSlide:not(:first-child) .hero{height:var(--carH,auto);overflow:hidden}   /* las nuevas miden lo mismo que Inicio */
.carSlide .hero.apretada{padding-top:10px;padding-bottom:10px;gap:2px}
.carSlide .hero.apretada .cIco:not(.ch){width:20px;height:20px}
.carSlide .hero.apretada .carTot{padding-top:2px}
.carSlide .hero.apretada .carFila,.carSlide .hero.apretada .carBarraF .fila{line-height:1.15}
.carSlide:not(:first-child) .hero{justify-content:space-between;gap:4px}   /* tarjetas nuevas: el aire que sobra se reparte parejo entre sus elementos (también arriba y abajo de cada línea) */
.carSlide:not(:first-child) .hero>*{margin-top:0 !important;margin-bottom:0 !important}
.carSlide:first-child .hero>*:last-child{margin-top:auto}   /* Inicio: 20 px arriba y abajo; si otra tarjeta es más alta, el pie se queda abajo */
#fqZona,#fqChips,#fqMenuZ,#qCuerpo{display:flow-root}   /* 13.5.1: sin márgenes que colapsen: la altura animada termina exacta (sin brinquito final) */
.carSlide .hero .heroLin{margin:14px 0 5px}   /* en flex no colapsa: 5px abajo + 5px de la barra = los 10px de antes */
.carDots{display:flex;gap:5px;justify-content:center;margin:11px 0 var(--espInicio);opacity:0;transition:opacity .2s}   /* 13.4.16, ítem 3: en el video los puntos solo se ven mientras se desliza (con la placa) */
.carPlacaCont.carPlacaOn .carDots{opacity:1}
.carDots i{width:7px;height:7px;border-radius:50%;background:var(--gr);opacity:.45;cursor:pointer;transition:all .3s}
.carDots i.on{background:var(--acc);opacity:1}   /* 13.4.16, ítem 3: en el video el punto activo no se estira, solo brilla más */
.carMini{width:18px;height:18px;border-radius:6px;color:#fff;font-size:9px;font-weight:800;display:inline-grid;place-items:center;flex:none}
.carBar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.carBar i{display:block;height:100%;border-radius:99px}
.carFila{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
.carBarra{height:14px;border-radius:99px;background:color-mix(in srgb, var(--fg) 10%, transparent);overflow:hidden;margin:8px 0 2px}
.carBarra i{display:block;height:100%;border-radius:99px;transform-origin:left;transform:scaleX(0);animation:llena .9s cubic-bezier(.3,0,.15,1) forwards}
.carFila .bn{font-weight:700;white-space:nowrap}
.carFila .ba{font-weight:800;white-space:nowrap}
.carDiv{height:1px;background:currentColor;opacity:.12;margin:4px 0}
.carTot{border-top:1px solid var(--line);margin-top:2px;padding-top:5px;display:flex;justify-content:space-between;font-size:12px}
.carTot b{font-size:13px}
.carStrip{margin-top:10px;background:color-mix(in srgb, currentColor 8%, transparent);border-radius:99px;text-align:center;font-size:12.5px;font-weight:700;padding:9px 8px}
/* ---- acordeón de Mi perfil (ítem 10; ronda 13.4.15 ítems 11-13: todas las secciones) ---- */
.ajSec{margin-bottom:12px;overflow:hidden}
.ajHead{display:flex;align-items:center;gap:10px;width:100%;padding:16px;text-align:left;font:inherit;color:inherit}
.ajIco{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb, var(--fg) 7%, transparent);display:grid;place-items:center;flex:none;color:var(--fg)}
.ajIco svg{width:20px;height:20px}
.ajHead .t{font-size:16.5px;font-weight:800;white-space:nowrap;flex:none}
.ajHead .s{margin-left:auto;font-size:13px;color:var(--gr);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ajSec.abierto .ajHead .s{display:none}
/* ítem 12: flecha ancha de patas, poco alta, siempre alineada a la derecha; apunta
   abajo cerrada y arriba (^) abierta. 13.4.16, ítem 5: más chica, 12×6 (antes 16×7
   en un cuadro de 24×24); el margin-left:auto la mantiene al final del cuadro
   cerrada y abierta (verificado: mismo borde derecho que las ">" de las filas) */
.ajFlecha{margin-left:auto;color:var(--gr);flex:none;display:grid;place-items:center;transition:transform .4s cubic-bezier(.3,0,.15,1)}
.ajFlecha svg{display:block}
.ajSec.abierto .ajFlecha{transform:rotate(180deg)}
/* ítem 13: desplegado/compactado suave con altura, y el texto aparece con animación
   (el cuerpo siempre está en el DOM, colapsado con max-height:0) */
.ajCuerpo{border-top:1px solid var(--line);padding:0 16px;height:0;box-sizing:border-box;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .3s cubic-bezier(.3,0,.15,1),visibility 0s .32s}   /* 13.5.1: la altura la anima JS (antes max-height: terminaba de golpe) */
.ajSec.abierto .ajCuerpo{height:auto;opacity:1;visibility:visible;padding:2px 16px 8px;transition:opacity .3s cubic-bezier(.3,0,.15,1) .04s,visibility 0s}
.ajCuerpo>*{opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
.ajSec.abierto .ajCuerpo>*{opacity:1;transform:none}
.ajSec.abierto .ajCuerpo>*:nth-child(1){transition-delay:.05s}
.ajSec.abierto .ajCuerpo>*:nth-child(2){transition-delay:.09s}
.ajSec.abierto .ajCuerpo>*:nth-child(3){transition-delay:.13s}
.ajSec.abierto .ajCuerpo>*:nth-child(4){transition-delay:.17s}
.ajSec.abierto .ajCuerpo>*:nth-child(5){transition-delay:.21s}
.ajSec.abierto .ajCuerpo>*:nth-child(n+6){transition-delay:.25s}
/* ---- filtro de Quincenas (ítem 9; ronda 13.4.15 ítems 1-3) ---- */
.fqBtn{width:40px;height:40px;border-radius:50%;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;flex:none;align-self:center;box-shadow:var(--sombra);transition:transform .25s}
.fqPanel{animation:entra .32s cubic-bezier(.3,0,.15,1) both}
.fqFila{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fqBtn.on{background:var(--acc);color:var(--accTxt)}
.fqBtn svg{width:19px;height:19px}
.fqChip{display:inline-flex;align-items:center;gap:7px;background:var(--acc);color:var(--accTxt);border-radius:99px;padding:8px 14px;font-size:14.5px;font-weight:700}
.fqChip .av{width:20px;height:20px;border-radius:50%;background:var(--accTxt);color:var(--acc);font-size:12px;font-weight:800;display:grid;place-items:center}
.fqMenu{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sombra);margin-top:8px;padding:6px 8px;width:240px;animation:entra .28s cubic-bezier(.3,0,.15,1) both}
.fqMenu .dh{font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--gr);padding:6px 10px 2px}
.fqMenu .di{display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:15px;font-weight:600;width:100%;text-align:left;border-radius:10px}
.fqMenu .di.sel{background:color-mix(in srgb, var(--acc) 12%, transparent);color:var(--acc)}   /* ítem 4c: la opción elegida se pinta de azul */
.fqMenu .di .av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--accTxt);font-size:13px;font-weight:800;display:grid;place-items:center;flex:none}
.fqTot{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;align-items:center}
/* ítem 10 (ronda 13.4.15): solo el anillo marca como pagado en la lista */
.anilloBtn{display:grid;place-items:center;padding:2px;border-radius:50%;flex:none}
.anilloBtn:active{transform:scale(.88)}
/* pantalla de configuración del carrusel (ítem 14): la tarjeta real, con un velo
   transparente encima para que el toque cambie su versión sin activar sus botones */
.carPantTap{position:absolute;inset:0;border-radius:26px}
/* ---- cápsulas de Inicio (ítem 5): icono grisáceo transparente ---- */
.pc .ico{background:rgba(127,127,140,.16) !important;box-shadow:none !important;color:var(--fg) !important}
.pcIco{background:none;border:0;padding:0;display:grid;place-items:center;flex:none;border-radius:12px}
.pcIco:active{transform:scale(.9)}
/* ---- flecha verde + registro de monto actualizado (ítem 3) ---- */
.flechaVerde{color:#1FA463;font-weight:800;font-size:15px;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.regMonto{font-size:12px;color:var(--gr);margin:6px 2px 0;line-height:1.4}
.regMonto b{color:#1FA463}
/* ---- Glass Dark (ítem 13): negro puro + un solo acento violeta ---- */
:root[data-tema="glassd"]{
  --bg:#030304; --fg:#FFFFFF; --gr:rgba(255,255,255,.45); --surf:rgba(255,255,255,.05); --line:rgba(255,255,255,.08);
  --acc:#7B2FF7; --accTxt:#FFFFFF; --nav:rgba(255,255,255,.04); --pill:rgba(123,47,247,.38); --icoSel:#FFFFFF; --ico:rgba(255,255,255,.6);
  --t-nar:rgba(255,255,255,.05); --t-ama:rgba(255,255,255,.05); --t-ver:rgba(255,255,255,.05); --t-azu:rgba(255,255,255,.05); --t-roj:rgba(255,255,255,.05);
  --r-nar:#FFFFFF; --r-ama:rgba(255,255,255,.7); --r-ver:#FFFFFF; --r-azu:#A78BFA; --r-roj:#FFFFFF;
  --tile:rgba(255,255,255,.06); --hero1:rgba(255,255,255,.06); --hero2:rgba(255,255,255,.02); --heroTxt:#FFFFFF;
  --sombra:0 14px 30px rgba(0,0,0,.6); color-scheme:dark;
}
:root[data-tema="glassd"] body{background:radial-gradient(120% 40% at 50% 0%, rgba(123,47,247,.16), transparent 60%), #030304;background-attachment:fixed}
:root[data-tema="glassd"] .caja,:root[data-tema="glassd"] .pago,:root[data-tema="glassd"] .pc,:root[data-tema="glassd"] .hero{position:relative;overflow:hidden}
:root[data-tema="glassd"] .caja::before,:root[data-tema="glassd"] .pago::before,:root[data-tema="glassd"] .pc::before,:root[data-tema="glassd"] .hero::before{content:"";position:absolute;top:0;left:14%;right:14%;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.7),transparent);pointer-events:none;z-index:1}
:root[data-tema="glassd"] .caja,:root[data-tema="glassd"] .pago,:root[data-tema="glassd"] .pc,:root[data-tema="glassd"] .seg,:root[data-tema="glassd"] nav{-webkit-backdrop-filter:blur(5px) saturate(130%);backdrop-filter:blur(5px) saturate(130%)}
:root[data-tema="glassd"] .seg button.sel{background:rgba(123,47,247,.38);color:#fff;box-shadow:none;border-color:rgba(123,47,247,.5)}
:root[data-tema="glassd"] nav button.sel{background:rgba(123,47,247,.38);color:#fff}
:root[data-tema="glassd"] .btn.lleno{background:#7B2FF7;color:#fff}
:root[data-tema="glassd"] .ico{background:#16161a !important;box-shadow:none !important;color:#fff !important;filter:grayscale(1)}
:root[data-tema="glassd"] .indIc{background:#1a1a1e !important;color:#fff !important}
:root[data-tema="glassd"] .tjIcono{background:rgba(255,255,255,.08);color:#fff}
:root[data-tema="glassd"] .aviso,:root[data-tema="glassd"] .alQ,:root[data-tema="glassd"] .interr{background:#fff !important;color:#000 !important}
:root[data-tema="glassd"] .hola .mas span[style]{background:#fff !important;color:#000 !important}
:root[data-tema="glassd"] .verde{color:#fff}
:root[data-tema="glassd"] .rad{--radC:#7B2FF7}
:root[data-tema="glassd"] .balChip{background:rgba(123,47,247,.38);color:#fff}
:root[data-tema="glassd"] .hero .barra{background:rgba(255,255,255,.2)}
:root[data-tema="glassd"] .hero .barra i{background:#fff}

/* ---- extras carrusel (ítem 11) y acordeón (ítem 10) ---- */
.ajSec{margin:22px 0 0 !important}
.carFalta{font-size:17px;font-weight:800;margin:8px 0 2px}
.carCirculo{width:34px;height:34px;border-radius:50%;border:2px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.carDias{display:flex;align-items:flex-end;gap:8px;height:76px;padding:8px 2px 0}
.carDia{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.carDia i{display:block;width:100%;max-width:22px;border-radius:4px 4px 0 0;background:var(--r-azu)}
.carDia span{font-size:11px;color:var(--gr)}

/* 13.5.0: placa del carrusel en vidrio translúcido según la apariencia (antes azul pizarra #606FA1) */
:root[data-tema="oscuro"] .carPlaca{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14)}
:root[data-tema="glass"] .carPlaca{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.4)}
:root[data-tema="glassb"] .carPlaca{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.08)}
:root[data-tema="glassn"] .carPlaca,:root[data-tema="glassd"] .carPlaca{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.15)}
/* 13.5.0: botón para subir (pantallas con "solo Atrás"): aparece al llegar al final */
#arriba{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));width:46px;height:46px;margin-left:-23px;border-radius:50%;background:var(--nav);box-shadow:var(--sombra);color:var(--ico);display:grid;place-items:center;z-index:40;opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .2s,transform .32s cubic-bezier(.34,1.56,.64,1)}
#arriba.ver{opacity:1;transform:none;pointer-events:auto}
#arriba svg{width:22px;height:22px}
:root[data-tema^="glass"] #arriba{-webkit-backdrop-filter:blur(5px) saturate(130%);backdrop-filter:blur(5px) saturate(130%);border:.5px solid rgba(255,255,255,.18)}

/* 13.5.1: íconos en las tarjetas nuevas del carrusel */
.cIco{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ic,currentColor);background:color-mix(in srgb, var(--ic,currentColor) 15%, transparent)}
.cIco svg{width:16px;height:16px}
.cIco.ch{width:14px;height:14px;background:none;border-radius:0}
.cIco.ch svg{width:14px;height:14px}
.carStrip{display:flex;align-items:center;justify-content:center;gap:6px}
.carBarraF{display:flex;align-items:center;gap:10px;margin:5px 0}

/* 13.5.2: tarjetas nuevas compactas para caber en la altura de Inicio (sin agrandar el carrusel) */
.carSlide:not(:first-child) .heroLin{margin:0}

.carSlide:not(:first-child) .cIco{width:22px;height:22px;border-radius:7px}
.carSlide:not(:first-child) .cIco svg{width:13px;height:13px}
.carSlide:not(:first-child) .cIco.ch{width:13px;height:13px}
.carSlide:not(:first-child) .carBarraF{margin:0}
.carSlide:not(:first-child) .carBarraF .fila{font-size:13px !important;line-height:1.25}
.carSlide:not(:first-child) .carBarra{height:8px;margin:3px 0 0}
.carSlide:not(:first-child) .carDias{height:56px}
.carSlide:not(:first-child) .carCirculo{width:26px;height:26px;font-size:12px}
.carSlide:not(:first-child) .carFalta{font-size:15px;margin:0}
.carSlide:not(:first-child) .carTot{padding-top:4px}

.carF50{margin:8px 0}
.carSlide:not(:first-child) .carF50{margin:0}
.carSlide:not(:first-child) .carF50 .fila{line-height:1.2}
.carSlide:not(:first-child) .balBarra{height:8px;margin:3px 0 0}
.carSlide:not(:first-child) svg[width="100"]{width:78px;height:78px}

/* 13.6: Gasto compartido */
.compTog{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--card);box-shadow:var(--sombra);cursor:pointer}
.compTog input{width:22px !important;height:22px;flex:none;margin:0;accent-color:var(--acc,#1C326E)}
#compBox{overflow:hidden}
#compBox.plegado{height:0;opacity:0;visibility:hidden}
#sugPer{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#sugPer:empty{display:none}
.sugChip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;background:color-mix(in srgb, var(--fg) 7%, transparent);color:var(--fg);font-size:14px;max-width:100%}
.sugChip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugOk{width:18px;height:18px;border-radius:50%;background:#1FA463;color:#fff;font-size:11px;display:grid;place-items:center;flex:none}
/* 13.6: signo de pesos en los campos de dinero (teclado numérico con inputmode="decimal") */
.pesosW{position:relative;display:block}
.pesosW::before{content:"$";position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--fg);opacity:.7;font-size:16px;pointer-events:none;z-index:1}
.pesosW>input{padding-left:30px !important;width:100%}

/* 13.6: ventana con diseño */
.rica{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 4px 4px}
.ricaIco{position:relative;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;animation:ricaPop .52s cubic-bezier(.34,1.56,.64,1) both}
.ricaIco svg{width:30px;height:30px}
.ricaIns{position:absolute;right:-8px;bottom:-6px;background:#fff;border-radius:12px;padding:2px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.ricaIns .ico{width:28px !important;height:28px !important;font-size:14px !important;border-radius:9px !important}
.ricaTit{font-size:21px !important;margin:16px 0 0 !important;text-align:center}
.ricaTx{color:var(--gr,#6B7280);font-size:14px;margin:6px 0 0;line-height:1.4}
.ricaDet{width:100%;margin-top:18px;padding:14px;border-radius:20px;background:color-mix(in srgb, var(--fg) 6%, transparent);text-align:left}
.ricaNota{margin-top:12px;padding:6px 12px;border-radius:99px;font-size:12px;text-align:center;background:color-mix(in srgb, var(--acc,#1C326E) 14%, transparent)}
.ricaBtns{width:100%;margin-top:20px;display:flex;flex-direction:column;gap:10px}
.btn.texto{background:none;color:var(--gr,#6B7280);padding:8px 16px}
.rica>*{animation:ricaEnt .34s cubic-bezier(.3,0,.15,1) both}
.rica>*:nth-child(2){animation-delay:.06s}.rica>*:nth-child(3){animation-delay:.1s}.rica>*:nth-child(4){animation-delay:.14s}.rica>*:nth-child(5){animation-delay:.18s}
@keyframes ricaEnt{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ricaPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* 13.6: monto arriba a la derecha, columnas, anillos y animación al mostrar la tarjeta */
.carMonto{font-size:22px;font-weight:800;white-space:nowrap;padding-left:8px}
.carCols{display:flex;align-items:flex-end;gap:6px;height:76px}
.carCol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.carCol b{font-size:11px}
.carCol i{display:block;width:24px;border-radius:7px;margin:4px 0;transform-origin:bottom}
.carCol span{font-size:11px;line-height:1.35;opacity:.65;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.carCol b{line-height:1.25;flex:none}
.carAnF{display:flex;align-items:center;gap:14px}
.carAnillos{flex:none;color:var(--fg)}
.carLey{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.carLey .peso{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carLey .punto{width:10px;height:10px;border-radius:50%;flex:none}
.carSlide.anima .carCol i{animation:colSube .62s cubic-bezier(.3,0,.15,1) both}
.carSlide.anima .anilloA{animation:anilloLlena .9s cubic-bezier(.3,0,.15,1) both}
.carSlide.anima .carBarra i{animation:llena .9s cubic-bezier(.3,0,.15,1) both}
.carSlide.anima .carMonto{animation:ricaEnt .46s cubic-bezier(.3,0,.15,1) .16s both}
@keyframes colSube{from{transform:scaleY(0)}to{transform:none}}
@keyframes anilloLlena{from{stroke-dashoffset:var(--L)}}

.carMed{position:relative;width:104px;height:58px;flex:none;color:var(--fg)}
.carMedTx{position:absolute;left:0;right:0;bottom:0;text-align:center;line-height:1.1}
.carMedTx b{display:block;font-size:15px}
.carMedTx span{font-size:10px;opacity:.65}

.carSlide .hero.apretada .carAnillos{width:80px;height:80px}
.carSlide .hero.apretada .carCols{height:80px}
.carSlide .hero.apretada .carF50 .fila{font-size:12px}
.carSlide .hero.apretada .heroLin{margin:0}

.carSlide:not(:first-child) .carBarra{height:12px}
.carSlide:not(:first-child) .carBarraF .cIco{width:30px;height:30px}

/* 13.6.3: las tarjetas nuevas usan los mismos márgenes, ícono y pie que la tarjeta principal; las gráficas son más chicas para caber sin amontonarse */
.carSlide:not(:first-child) .hero{padding:20px 20px 12px}
.carSlide:not(:first-child) .carStrip{margin:0;padding:9px 12px;font-size:12px;font-weight:400;opacity:.85;gap:8px}
.carSlide:not(:first-child) .carStrip .cIco.ch{width:16px;height:16px}
.carSlide:not(:first-child) .carStrip .cIco.ch svg{width:16px;height:16px}
.carSlide:not(:first-child) .carMonto{font-size:24px}
.carSlide .hero.apretada{padding-top:14px !important;padding-bottom:10px !important}

.carSlide:not(:first-child) .carLey{padding:1px 0}
.carSlide:not(:first-child) .carDias{height:44px}
.carSlide:not(:first-child) .carF50 .fila{font-size:12px;line-height:1.15}
.carSlide:not(:first-child) .balBarra{height:7px;margin:2px 0 0}
.carSlide:not(:first-child) svg[width="100"]{width:66px;height:66px}

.carSlide:not(:first-child) .heroN > .fila:first-child .peso > *{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.carSlide:not(:first-child) .carFila .cIco{width:20px;height:20px;border-radius:6px}
.carSlide:not(:first-child) .carFila .cIco svg{width:12px;height:12px}

/* 13.6.5: Quincenas medida sobre el ejemplo: línea pegada al encabezado, filas de 31 px separadas 9, y lo que sobra se reparte en los huecos de abajo */
.carSlide .hero.carQuin{justify-content:flex-start !important;gap:0 !important;padding:20px 20px 12px !important}
.carSlide .hero.carQuin>.heroLin{margin:4px 0 0 !important}
.carSlide .hero.carQuin>.carBarraF{margin:auto 0 0 !important;min-height:31px}
.carSlide .hero.carQuin>.carStrip{margin-top:auto !important}

.carSlide .hero.carQuin .carBarraF .cIco svg{width:16px;height:16px}
.carSlide .hero.carQuin .carBarraF .fila{font-size:14px !important;line-height:17px}
.carSlide .hero.carQuin .carBarra{height:11px !important;margin:3px 0 0 !important}

/* 13.7: personas del gasto compartido */
.genteFila{display:flex;align-items:center;gap:10px;margin-top:6px;padding:6px 6px 6px 12px;border-radius:14px;background:color-mix(in srgb, var(--fg) 5%, transparent)}
.genteAv{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ava,#1C326E);color:#fff;font-weight:800;flex:none}
.genteX{width:40px;height:40px;flex:none;color:var(--gr,#6B7280);font-size:16px;background:none}

.msiFila{display:block;width:100%;padding:10px 0;border-bottom:1px solid var(--line);background:none;color:var(--fg)}
.msiFila:last-of-type{border-bottom:0}

/* 13.8.1: invitaciones que enviaste */
.invFila{display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;padding:10px 10px 10px 12px;border-radius:18px;background:color-mix(in srgb, var(--fg) 4%, transparent);color:var(--fg);animation:ricaEnt .32s cubic-bezier(.3,0,.15,1) both}
.invFila .ico{width:36px !important;height:36px !important;flex:none}

.impBtn{display:block;cursor:pointer;margin-top:8px;background:color-mix(in srgb, var(--acc,#1C326E) 10%, transparent)}
</style>
</head>
<body>
<div id="fondoGlass"></div>
<main id="app"></main>

<button id="arriba" data-act="irArriba" aria-label="Ir arriba"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
<div id="capa"></div>
<div class="toast" id="toast" role="status"></div>
<div id="jalar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="fl" d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6"/><path class="fl" d="M17.7 2.8v3.8h-3.8M6.3 21.2v-3.8h3.8"/><path class="ok" d="M6 12.5l4 4 8-8"/></svg></div>
<script>
/* ===================== datos ===================== */
const LS = 'mispagos.v1';
let D = cargar();
function cargar(){
  try{ const d = JSON.parse(localStorage.getItem(LS)); if(d && d.pagos) return d; }catch(e){}
  return {pagos:[], nombre:'', tema:'auto', quincena:15, personas:[], ingreso:0, ingresoPago:'', ingresoFrec:0, otros:0};
}
function guardar(){ try{ localStorage.setItem(LS, JSON.stringify(D)); }catch(e){ aviso('No se pudo guardar en este navegador'); } if(typeof programarAvisos === 'function') programarAvisos(); }

const DIA = 86400000;
const vibrar = p => { if(navigator.vibrate) navigator.vibrate(p); };   /* en iPhone la web no puede vibrar: se ignora sin error */
function hoy(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fecha(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function dias(s){ return Math.round((fecha(s) - hoy()) / DIA); }
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DSEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function corto(s){ const d = fecha(s); return d.getDate()+' '+MESES[d.getMonth()]; }
function dinero(v){ v = Number(v)||0; return '$' + v.toLocaleString('es-MX', {maximumFractionDigits: v % 1 ? 2 : 0, minimumFractionDigits: v % 1 ? 2 : 0}); }
function num(v){ return parseFloat(String(v||'').replace(/[^0-9.]/g,''))||0; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sinPrefijo(n){ return n.replace(/^Pagar |^Pago /,''); }

const FRECS = {M1:'mensual', M2:'bimestral', M3:'trimestral', M6:'semestral', M12:'anual', D15:'quincenal', D7:'semanal', U:'una sola vez'};
const CATS = {tarjeta:['💳','Tarjeta de crédito'], tienda:['🛍️','Crédito departamental'], carro:['🚗','Pago del auto'], prestamo:['🏦','Préstamo'], msi:['🗓️','Compra a meses (MSI)'],
  renta:['🏠','Renta / vivienda'], luz:['💡','Luz, agua o gas'], internet:['📡','Internet'], telefono:['📱','Teléfono'], despensa:['🛒','Despensa y súper'],
  gasolina:['⛽','Gasolina y transporte'], salud:['🩺','Salud y consultas'], seguro:['🛡️','Seguros'],
  escuela:['🎓','Escuela y colegiaturas'], personal:['🧹','Personal y empleados'], proveedor:['📦','Proveedores'], ahorro:['🐷','Ahorro'],
  streaming:['🎬','Suscripciones y membresías'], grupo:['👥','Tanda o grupo'], extra:['⚠️','Gastos extraordinarios'], otro:['📌','Otro']};
const GRUPO_CAT = {tarjeta:'Créditos y préstamos', tienda:'Créditos y préstamos', carro:'Créditos y préstamos', prestamo:'Créditos y préstamos', msi:'Créditos y préstamos',

function dona(vals, cols, centro){

function b64u(s){ const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); }

    return 'Este navegador no permite avisos. En iPhone: ábrela en Safari, toca Compartir → "Agregar a pantalla de inicio" y ábrela desde ese ícono (iOS 16.4 o más nuevo).';

  if(im.complete) ini(); else im.onload = ini;

  box.onpointerdown = e => { arr = true; px = e.clientX; py = e.clientY; box.setPointerCapture(e.pointerId); };
  box.onpointermove = e => { if(!arr) return; st.x += e.clientX - px; st.y += e.clientY - py; px = e.clientX; py = e.clientY; lim(); };

/* ítem 4b (ronda 13.4.16): elegir persona o dirección anima como el segmentado:
   las tarjetas de quincena salen deslizándose y las nuevas entran escalonadas;
   antes el cambio era instantáneo, sin animación. */

/* 13.5.1: transición en su sitio. Lo viejo se desvanece con una curva que frena al final, la altura se desliza
   de la vieja a la nueva y lo nuevo entra escalonado (de lado si viene del segmentado, hacia abajo si es un
   desplegado). No se repinta la pantalla: sin brinquito al inicio ni al final. */
const CURVA = 'cubic-bezier(.3,0,.15,1)', SALIDA = 'cubic-bezier(.4,0,.6,1)';
function salidaZona(el, dir){
  if(!el) return; el.dataset.salio = '1';
  [...el.children].forEach(k => k.animate([{opacity:1, transform:'none'},{opacity:0, transform: dir ? `translateX(${-dir*6}%)` : 'translateY(-4px)'}], {duration:170, easing:SALIDA, fill:'forwards'}));
}
function transZona(el, html, dir){
  if(!el) return;
  el.getAnimations().forEach(a => a.cancel()); clearTimeout(el._t);
  const h0 = el.getBoundingClientRect().height;
  const fin = () => {
    delete el.dataset.salio;
    el.innerHTML = html;
    el.style.height = 'auto'; const h1 = el.getBoundingClientRect().height, kids = [...el.children];   /* la altura real final, medida igual que al terminar */
    el.style.height = h0 + 'px'; el.style.overflow = 'clip'; el.style.overflowClipMargin = '24px';
    kids.forEach(k => { k.style.opacity = 0; });
    requestAnimationFrame(() => {   // arranca en el siguiente cuadro, ya con lo nuevo puesto
      const an = el.animate([{height:h0 + 'px'},{height:h1 + 'px'}], {duration:Math.max(220, Math.min(380, 220 + Math.abs(h1 - h0) / 4)), easing:CURVA});
      el.style.height = h1 + 'px';
      an.onfinish = () => { el.style.height = ''; el.style.overflow = ''; el.style.overflowClipMargin = ''; };
      kids.forEach((k, i) => { k.style.opacity = ''; k.animate([{opacity:0, transform: dir ? `translateX(${dir*6}%)` : 'translateY(-8px)'},{opacity:1, transform:'none'}], {duration:340, delay:60 + Math.min(i, 5) * 40, easing:CURVA, fill:'backwards'}); });
    });
  };
  if(!el.children.length || el.dataset.salio){ fin(); return; }
  salidaZona(el, dir); el._t = setTimeout(fin, 175);
}

/* ítem 4 (ronda 13.4.15): el segmentado de Quincenas usa la misma animación de
   deslizamiento que el de Calendario/Quincenas, pero dejando terminar el
   deslizamiento de la pastilla (420 ms) antes de repintar; antes se repintaba a
   los 140 ms y la pastilla brincaba a su sitio de golpe. */
function fqSegCambiar(b, n){
  const seg = b.parentElement, act = seg.querySelector('.sel');
  if(!act || act === b) return;
  vibrar([10]);
  const dx = b.offsetLeft - act.offsetLeft, d = dx > 0 ? 1 : -1;
  /* 13.5.1: la pastilla se mueve y, al mismo tiempo, lo de abajo empieza a salir hacia el lado contrario;
     al llegar la pastilla, solo cambian en su sitio los chips y las tarjetas (sin repintar la pantalla) */
  act.style.color = 'var(--fg)'; b.style.color = 'var(--accTxt)'; b.style.position = 'relative'; b.style.zIndex = 1; act.style.zIndex = 0;
  const mov = act.animate([{transform:'translateX(0)'},{transform:`translateX(${dx}px)`}], {duration:300, easing:CURVA, fill:'forwards'});

/* la pastilla del selector se desliza a la opción elegida; el repintado espera los 420 ms
   completos a que la pastilla llegue (igual que fqSegCambiar): antes se repintaba a los
   140 ms y la pastilla nueva aparecía en su sitio final mientras la vieja aún se movía:
   el brinquito al final de la animación */
function deslizar(b, fin){
  const seg = b.parentElement, act = seg.querySelector('.sel');
  if(!act || act === b){ fin(); return; }
  const dx = b.offsetLeft - act.offsetLeft;
  act.style.color = 'var(--fg)';
  const p = act.animate([{transform:'translateX(0)'},{transform:`translateX(${dx}px)`}], {duration:300, easing:CURVA, fill:'forwards'});
  b.style.color = 'var(--accTxt)'; b.style.position = 'relative'; b.style.zIndex = 1; act.style.zIndex = 0;
  /* 13.5.1: sale con una curva que frena (antes se cortaba a toda velocidad y quedaba un hueco vacío) y lo nuevo
     entra en el cuadro siguiente al repintar, con el mismo recorrido: sin brinquito al inicio ni al final */
  const d = dx > 0 ? 1 : -1, sale = []; let n = seg.nextElementSibling; while(n){ sale.push(n); n = n.nextElementSibling; }
  sale.forEach(e => e.animate([{transform:'none', opacity:1},{transform:`translateX(${-d*12}%)`, opacity:0}], {duration:220, easing:SALIDA, fill:'forwards'}));
  p.onfinish = () => { const y = scrollY; fin(); if(Math.abs(scrollY - y) > 1) window.scrollTo(0, y);
    const s2 = document.querySelector('.seg'); const ent = []; let m = s2 && s2.nextElementSibling;
    while(m){ m.style.opacity = 0; ent.push(m); m = m.nextElementSibling; }
    requestAnimationFrame(() => ent.forEach((e, i) => { e.style.opacity = ''; e.animate([{transform:`translateX(${d*12}%)`, opacity:0},{transform:'none', opacity:1}], {duration:340, delay:Math.min(i, 4) * 30, easing:CURVA, fill:'backwards'}); })); };
}
/* ===== Bóveda: los datos para pagar se guardan cifrados (AES-256-GCM) con una llave que el navegador
   genera y marca como NO extraíble; ni la propia página puede leer la llave, solo usarla. ===== */
const Boveda = (() => {
  const abrir = () => new Promise((ok, mal) => { const r = indexedDB.open('mispagos-boveda', 2); r.onupgradeneeded = () => { const db = r.result; if(!db.objectStoreNames.contains('llave')) db.createObjectStore('llave'); if(!db.objectStoreNames.contains('datos')) db.createObjectStore('datos'); }; r.onsuccess = () => ok(r.result); r.onerror = mal; });
  const op = async (tienda, modo, f) => { const db = await abrir(); return new Promise((ok, mal) => { const tx = db.transaction(tienda, modo); const req = f(tx.objectStore(tienda)); tx.oncomplete = () => ok(req && req.result); tx.onerror = mal; }); };
  let llaveP = null;
  const llave = () => llaveP || (llaveP = (async () => {
    let k = await op('llave', 'readonly', s => s.get('k'));
    if(!k){ k = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); await op('llave', 'readwrite', s => s.put(k, 'k')); }
    return k; })());
  let parP = null;
  const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a))), deB64 = t => Uint8Array.from(atob(t), ch => ch.charCodeAt(0));
  const par = () => parP || (parP = (async () => {
    let k = await op('llave', 'readonly', s => s.get('e2e'));
    if(!k){ k = await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, false, ['deriveBits']); await op('llave', 'readwrite', s => s.put(k, 'e2e')); }
    return k; })());
  const llaves = {};
  const comun = async pubOtro => {
    if(llaves[pubOtro]) return llaves[pubOtro];
    const otra = await crypto.subtle.importKey('spki', deB64(pubOtro), {name:'ECDH', namedCurve:'P-256'}, false, []);
    const bits = await crypto.subtle.deriveBits({name:'ECDH', public:otra}, (await par()).privateKey, 256);
    const base = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    return llaves[pubOtro] = await crypto.subtle.deriveKey({name:'HKDF', hash:'SHA-256', salt:new TextEncoder().encode('mispagos-e2e-v1'), info:new TextEncoder().encode('datos')}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  };
  return {
    async publica(){ return b64(await crypto.subtle.exportKey('spki', (await par()).publicKey)); },
    async e2eCifrar(pubOtro, texto){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, await comun(pubOtro), new TextEncoder().encode(texto))); const t = new Uint8Array(12 + ct.length); t.set(iv); t.set(ct, 12); return 'e2e1:' + b64(t); },
    async e2eDescifrar(pubOtro, s){ const t = deB64(s.slice(5)); return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:t.slice(0,12)}, await comun(pubOtro), t.slice(12))); },
    async guardar(id, obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await llave(), new TextEncoder().encode(JSON.stringify(obj))); await op('datos', 'readwrite', s => s.put({iv, ct}, String(id))); },
    async leer(id){ try{ const r = await op('datos', 'readonly', s => s.get(String(id))); if(!r) return {cuenta:'', referencia:'', titular:''}; return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:r.iv}, await llave(), r.ct))); }
      catch(e){ return {cuenta:'', referencia:'', titular:'', _error:true}; } },   /* nunca deja a medias la sincronización ni el botón Ver */
  };
})();

function aplicarTema(){
  document.documentElement.style.setProperty('--blurGlass', [5, 6.5, 7.5, 9][D.glassBlur || 0] + 'px');
  let t = D.tema || 'auto';
  const noche = matchMedia('(prefers-color-scheme: dark)').matches;
  if(t === 'auto') t = noche ? 'oscuro' : 'claro1';
  const gn = noche && D.glassNoche;   // Glass y Glass blanco pasan a Glass oscuro de noche solo si se activó
  if(t === 'glass') t = gn ? 'glassn' : 'glass';
  if(t === 'glassb') t = gn ? 'glassn' : 'glassb';
  if(t === 'glasso') t = 'glassn';
  if(t === 'liquid') t = 'glassn';   /* Liquid Glass quedó pendiente: se ve como Glass oscuro */
  if(t === 'claro2') t = 'claro1';   // "Claro 2" ya no existe
  document.documentElement.dataset.tema = t;
  if(D.fondoGlass) document.documentElement.style.setProperty('--fondoGlass', `url(${D.fondoGlass})`); else document.documentElement.style.removeProperty('--fondoGlass');
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { aplicarTema(); pintar(); });

(() => {
  const bola = document.getElementById('jalar'), app = document.getElementById('app'), UMBRAL = 80, MAX = 120;
  let y0 = null, x0 = 0, d = 0, ocupado = false, eje = null;
  const mover = (v, anim) => {
    bola.classList.toggle('vuelve', !!anim); app.style.transition = anim ? 'transform .26s cubic-bezier(.2,.8,.2,1)' : 'none';
    bola.style.transform = `translateY(${Math.min(v, MAX) - 60}px) rotate(${v * 2.2}deg)`; bola.style.opacity = Math.min(1, v / (UMBRAL * .6));
    app.style.transform = v ? `translateY(${Math.min(v, MAX) * .35}px)` : '';
  };
  document.addEventListener('touchstart', e => {
    if(ocupado || window.scrollY > 0 || document.querySelector('.hoja.abierta, .hoja') || e.target.closest('.prox, .hoja, input, textarea, select')) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; d = 0; eje = null; }, {passive:true});
  document.addEventListener('touchmove', e => {
    if(y0 === null) return; const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if(!eje){ if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return; eje = Math.abs(dy) > Math.abs(dx) * 1.5 ? 'y' : 'x'; }
    if(eje === 'x'){ y0 = null; if(d){ d = 0; mover(0, true); } return; }   // gesto de lado: no es jalar
    if(dy <= 0 || window.scrollY > 0){ if(d){ d = 0; mover(0, true); } return; }
    e.preventDefault(); d = dy * .55; mover(d);
  }, {passive:false});
  document.addEventListener('touchend', () => {
    if(y0 === null) return; y0 = null;
    if(d < UMBRAL){ d = 0; mover(0, true); return; }
    ocupado = true; mover(UMBRAL * .9, true); bola.classList.add('girando');
    const trabajo = (D.nube && D.nube.refresh) ? sincronizar() : Promise.resolve('Actualizado. Para compartir pagos inicia sesión en Mi perfil → Cuenta.');

  });
})();

      <button class="btn lleno" id="blEnv" style="margin-top:12px">Enviar enlace de recuperación</button><p class="gris chico" id="blAv" style="display:none;line-height:1.4;margin:10px 0 0"></p>
      <input id="blNueva" type="password" placeholder="Contraseña nueva de tu cuenta" style="margin-top:12px;font-size:16px;display:none"><button class="btn lleno" id="blComp" style="margin-top:10px;display:none">Comprobar y entrar</button>
      <button class="blLink" id="blVol">Volver</button>`);
    const env = c.querySelector('#blEnv'), nv = c.querySelector('#blNueva'), comp = c.querySelector('#blComp'), dato = c.querySelector('#blDato'), av = c.querySelector('#blAv');
    c.querySelector('#blVol').onclick = mostrarEntrar;
    env.onclick = async () => {
      const q = dato.value.trim(), esC = q.includes('@'), d10 = x => (x||'').replace(/\D/g,'').slice(-10);
      const ok = esC ? q.toLowerCase() === correo.toLowerCase() : (d10(q).length === 10 && d10(q) === d10(D.miTel));
      if(!ok){ dato.value = ''; dato.placeholder = esC ? 'Ese correo no es el de tu cuenta' : 'Ese teléfono no es el de tu cuenta'; temblar(dato); return; }
      env.disabled = true; env.textContent = 'Enviando…';
      try{ await pedir('POST', AUTHU + 'sendOobCode?key=' + FB.key, {requestType:'PASSWORD_RESET', email:correo}); env.textContent = 'Volver a enviar';
        av.textContent = esC ? '✓ Te enviamos un correo a ' + q + '. Revisa también spam.' : '✓ Te enviamos el enlace al correo de la cuenta del ' + q + ' (' + tapar(correo) + '). Revisa también spam.';
        av.style.display = nv.style.display = comp.style.display = ''; nv.focus(); }
      catch(e){ env.textContent = 'Reintentar'; aviso('No se pudo enviar el correo. Revisa tu internet.'); }
      env.disabled = false; };
    comp.onclick = async () => { if(nv.value.length < 6){ temblar(nv); return; } comp.disabled = true; comp.textContent = 'Comprobando…';
      try{ await pedir('POST', AUTHU + 'signInWithPassword?key=' + FB.key, {email:correo, password:nv.value, returnSecureToken:true});
        const sal = b64(crypto.getRandomValues(new Uint8Array(12))); D.bloqueo = {sal, hash: await hash(sal, nv.value), cred: D.bloqueo.cred || null}; guardar();
        aviso('✓ Listo: ahora entras con la contraseña nueva'); cerrar(); }
      catch(e){ nv.value = ''; nv.placeholder = 'No coincide. ¿Ya la cambiaste desde el correo?'; temblar(nv); }
      comp.disabled = false; comp.textContent = 'Comprobar y entrar'; };
  }
  async function mostrarCrear(cambiar){
    const hayFace = await faceId();
    const c = pantalla(`<b style="font-size:22px;display:block">${cambiar ? 'Nueva contraseña' : 'Protege Mis Pagos'}</b><p class="gris" style="line-height:1.4;margin:8px 0 0">Crea una contraseña para entrar a la app, como en una app de banco. Así nadie más ve tus pagos ni los datos de tus tarjetas.</p>
      <input id="blA" type="password" placeholder="Contraseña (mínimo 4 caracteres)" autocomplete="new-password" style="margin-top:16px;font-size:16px"><input id="blB" type="password" placeholder="Repite la contraseña" autocomplete="new-password" style="margin-top:10px;font-size:16px">
      ${hayFace ? `<label style="display:flex;align-items:center;gap:10px;margin-top:12px"><input type="checkbox" id="blF" checked style="width:auto;margin:0"><span>También entrar con Face ID</span></label>` : ''}
      <button class="btn lleno" id="blG" style="margin-top:14px">Guardar contraseña</button>${cambiar ? '' : '<button class="blLink" id="blNo">Ahora no</button>'}`);
    c.querySelector('#blG').onclick = async () => {
      const a = c.querySelector('#blA'), b = c.querySelector('#blB');
      if(a.value.length < 4){ a.value = ''; a.placeholder = 'Mínimo 4 caracteres'; temblar(a); return; }
      if(a.value !== b.value){ b.value = ''; b.placeholder = 'No coincide'; temblar(b); return; }
      const sal = b64(crypto.getRandomValues(new Uint8Array(12)));
      let cred = null; const f = c.querySelector('#blF'); if(f && f.checked){ try{ cred = await crearCred(); }catch(e){ cred = null; } }
      D.bloqueo = {sal, hash: await hash(sal, a.value), cred}; D.bloqueoPreg = true; guardar();
      aviso(cred ? '✓ Listo: entrarás con Face ID o tu contraseña' : '✓ Contraseña guardada'); cerrar(); pintar(); };
    const no = c.querySelector('#blNo'); if(no) no.onclick = () => { D.bloqueoPreg = true; guardar(); cerrar(); };
  }
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ ocultaDesde = Date.now(); return; }
    if(activo() && ocultaDesde && Date.now() - ocultaDesde > (D.bloqueoMin != null ? D.bloqueoMin : 10) * 60000 && !document.getElementById('bloqueo')){ abierta = false; mostrarEntrar(); }   /* si ya está la pantalla de entrada (p. ej. a medio recuperar), se queda como está */
    ocultaDesde = 0; });
  return {
    iniciar(){ if(activo() && !abierta){ mostrarEntrar(); return; }
      if(!activo() && !D.bloqueoPreg && D.pagos.length) setTimeout(() => { D.bloqueoPreg = true; guardar(); mostrarCrear(false); }, 1200); },
    ajustes(){ if(!activo()) return mostrarCrear(true);
      abrirHoja(`<h1>Entrar con contraseña${D.bloqueo.cred ? ' y Face ID' : ''}</h1><div class="caja" style="padding:4px 16px">
        <button class="dato" style="width:100%;padding:14px 0" data-act="blCambiar"><span>Cambiar contraseña</span><span class="gris">›</span></button>
        <button class="dato" style="width:100%;padding:14px 0;border-top:1px solid var(--line)" data-act="blQuitar"><span>Quitar el bloqueo</span><span class="gris">›</span></button></div>
        <button class="btn borde" style="margin-top:14px" data-act="cerrar">Cerrar</button>`); },
    cambiar(){ cerrarHoja(); mostrarCrear(true); },
    async quitar(){ const pw = prompt('Escribe tu contraseña para quitar el bloqueo'); if(pw === null) return;
      if(await hash(D.bloqueo.sal, pw) !== D.bloqueo.hash){ aviso('Contraseña incorrecta'); return; } D.bloqueo = null; guardar(); cerrarHoja(); pintar(); aviso('Bloqueo quitado'); }
  };
})();

setTimeout(() => Bloq.iniciar(), 50);
</script>
